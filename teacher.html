<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#f2efe7">
<title>Панель преподавателя · Тренажёр ЕГЭ</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="stylesheet" href="katex/katex.min.css">
<script defer src="katex/katex.min.js"></script>
<script defer src="katex/auto-render.min.js"></script>
<style>
  @font-face{font-family:'Golos Text';font-style:normal;font-weight:400 700;font-display:swap;
    src:url(fonts/golos-text-cyrillic.woff2) format('woff2');unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116;}
  @font-face{font-family:'Golos Text';font-style:normal;font-weight:400 700;font-display:swap;
    src:url(fonts/golos-text-latin.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;}
  @font-face{font-family:'Literata';font-style:normal;font-weight:400 700;font-display:swap;
    src:url(fonts/literata-cyrillic.woff2) format('woff2');unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116;}
  @font-face{font-family:'Literata';font-style:normal;font-weight:400 700;font-display:swap;
    src:url(fonts/literata-latin.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;}
  :root{
    color-scheme:light;
    /* ground */
    --paper:#f2efe7;--surface:#fdfcf9;--surface-2:#eeeade;
    --ink:#221f1a;--ink-2:#4e493f;--ink-3:#635d51;
    --line:#e2ddd0;--line-strong:#cdc6b5;
    /* accent — чернильно-синий */
    --accent:#1d4e89;--accent-hover:#163f70;--accent-on:#ffffff;
    --accent-soft:#e7eef7;--accent-line:#bccfe6;
    --focus:#1d4e89;
    /* статусы */
    --ok:#2f7d54;--ok-text:#1f5b3a;--ok-soft:#e3efe8;--ok-on:#ffffff;
    --warn:#c8861f;--warn-text:#754d0d;--warn-soft:#f8eeda;--warn-on:#2a1c05;
    --todo:#4a4a44;--todo-text:#43433d;--todo-soft:#e9e7e0;--todo-on:#ffffff;
    --err:#b23c2e;--err-text:#932f22;--err-soft:#f9e7e3;--err-on:#ffffff;
    /* высота (тёплые тени, не чёрные) */
    --e1:0 1px 2px rgba(74,58,38,.05);
    --e2:0 2px 4px rgba(74,58,38,.05),0 10px 24px -8px rgba(74,58,38,.14);
    --e3:0 4px 10px rgba(74,58,38,.08),0 18px 40px -12px rgba(74,58,38,.2);
    /* поверхности-компоненты */
    --header-bg:rgba(242,239,231,.88);--vbar-bg:rgba(253,252,249,.9);
    --input-bg:#ffffff;--track:#e6e1d4;
    --invert-1:#25282a;--invert-2:#1a1d1f;--invert-ink:#f4f2ec;
    --invert-tile:rgba(255,255,255,.07);--invert-line:rgba(255,255,255,.12);
    --dot-empty:#fdfcf9;--img-filter:none;
    --sk-base:#e8e3d7;--sk-shine:#f5f2ea;
    /* шкала кегля */
    --fs-2xs:11.5px;--fs-xs:12.5px;--fs-sm:13.5px;--fs-base:15px;--fs-md:16px;
    --fs-lg:18px;--fs-xl:21px;--fs-2xl:25px;--fs-3xl:30px;
    /* шкала отступов */
    --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:20px;--s6:24px;--s8:32px;--s10:40px;--s12:48px;--s16:64px;
    /* радиусы */
    --r-sm:8px;--r-md:12px;--r-lg:16px;--r-full:999px;
    /* движение */
    --dur:.18s;--ease:cubic-bezier(.2,.8,.3,1);
    /* Отдельная кривая для раскрытия. Основная --ease очень резкая на
       старте: 62% пути за первые 20% времени. Для кнопки это бодро, для
       панели в 650px — рывок. Здесь спокойное замедление. */
    --ease-reveal:cubic-bezier(.22,.61,.36,1);
    /* постоянная часть высоты карточки задачи (без чертежа) — для оценки
       content-visibility. На телефоне больше: тот же текст занимает
       больше строк. Замерено на заданиях 1, 4, 6, 12. */
    --card-base:280px;
    /* легаси-псевдонимы: на них ссылается JS */
    --green:var(--ok);--orange:var(--warn);--dark:var(--todo);--muted:var(--ink-3);
    --bg:var(--paper);
  }
  html[data-theme="dark"]{
    color-scheme:dark;
    --paper:#161713;--surface:#1f211d;--surface-2:#282a25;
    --ink:#eae5da;--ink-2:#a8a498;--ink-3:#a09c8b;
    --line:#33362f;--line-strong:#454940;
    --accent:#7fb2ea;--accent-hover:#9cc5f2;--accent-on:#0e1a28;
    --accent-soft:rgba(127,178,234,.14);--accent-line:rgba(127,178,234,.38);
    --focus:#9cc5f2;
    --ok:#4caf7d;--ok-text:#6cc396;--ok-soft:rgba(76,175,125,.16);--ok-on:#0c1f16;
    --warn:#d9932f;--warn-text:#e0a955;--warn-soft:rgba(217,147,47,.15);--warn-on:#241704;
    --todo:#8d8a7e;--todo-text:#adaa9c;--todo-soft:rgba(141,138,126,.18);--todo-on:#16170f;
    --err:#e0685a;--err-text:#e8867a;--err-soft:rgba(224,104,90,.16);--err-on:#220906;
    --e1:0 1px 2px rgba(0,0,0,.4);
    --e2:0 2px 4px rgba(0,0,0,.4),0 10px 24px -8px rgba(0,0,0,.55);
    --e3:0 4px 10px rgba(0,0,0,.45),0 18px 40px -12px rgba(0,0,0,.6);
    --header-bg:rgba(22,23,19,.88);--vbar-bg:rgba(31,33,29,.9);
    --input-bg:#1b1d19;--track:#2e312a;
    --invert-1:#2b2e28;--invert-2:#212420;--invert-ink:#eae5da;
    --invert-tile:rgba(255,255,255,.06);--invert-line:rgba(255,255,255,.1);
    --dot-empty:#1f211d;--img-filter:invert(.92) hue-rotate(180deg);
    --sk-base:#2b2e27;--sk-shine:#383c33;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);
    font-family:'Golos Text',system-ui,sans-serif;font-size:var(--fs-md);line-height:1.55;
    -webkit-font-smoothing:antialiased;}
  h1,h2,h3{font-family:'Literata',Georgia,serif;font-weight:600;letter-spacing:-.011em;line-height:1.2;margin:0;}
  :focus-visible{outline:2px solid var(--focus);outline-offset:2px;}
  button{font:inherit;}
  a{color:var(--accent);}

  header{position:sticky;top:0;z-index:50;background:var(--header-bg);
    backdrop-filter:saturate(180%) blur(10px);-webkit-backdrop-filter:saturate(180%) blur(10px);
    border-bottom:1px solid var(--line);}
  .head-inner{max-width:1180px;margin:0 auto;padding:var(--s3) var(--s6);display:flex;
    align-items:center;gap:var(--s3);min-height:60px;flex-wrap:wrap;}
  .title{font-family:'Literata',Georgia,serif;font-weight:700;font-size:var(--fs-lg);cursor:pointer;margin-right:auto;}
  .title span{color:var(--accent);}
  .ghost{font-size:var(--fs-sm);font-weight:500;color:var(--ink-2);background:transparent;
    border:1px solid var(--line-strong);border-radius:var(--r-md);padding:0 var(--s3);min-height:38px;
    cursor:pointer;display:inline-flex;align-items:center;gap:var(--s2);text-decoration:none;}
  .ghost:hover{color:var(--accent);border-color:var(--accent-line);background:var(--accent-soft);}
  .btn{font-size:var(--fs-sm);font-weight:600;border-radius:var(--r-md);min-height:40px;padding:0 var(--s4);
    cursor:pointer;border:1px solid transparent;background:var(--accent);color:var(--accent-on);}
  .btn:hover{background:var(--accent-hover);}
  .btn.quiet{background:transparent;color:var(--ink-2);border-color:var(--line-strong);}
  .btn.quiet:hover{color:var(--accent);border-color:var(--accent-line);background:var(--accent-soft);}
  .btn.danger{background:transparent;color:var(--err-text);border-color:var(--line-strong);}
  .btn.danger:hover{background:var(--err-soft);border-color:var(--err);}

  main{max-width:1180px;margin:0 auto;padding:var(--s8) var(--s6) var(--s16);}
  .lead{color:var(--ink-3);margin:var(--s2) 0 var(--s6);}
  .panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
    box-shadow:var(--e1);padding:var(--s6);margin-bottom:var(--s5);}
  .panel h3{font-size:var(--fs-lg);margin-bottom:var(--s4);}
  .toolbar{display:flex;gap:var(--s3);align-items:center;flex-wrap:wrap;margin-bottom:var(--s4);}
  .toolbar .grow{flex:1;}
  .muted{color:var(--ink-3);font-size:var(--fs-sm);}
  .center{text-align:center;padding:var(--s12) var(--s4);}
  .tabs{display:flex;gap:var(--s2);margin-bottom:var(--s5);flex-wrap:wrap;}
  .tabs a{display:inline-flex;align-items:center;gap:var(--s2);min-height:40px;padding:0 var(--s4);
    border:1px solid var(--line-strong);border-radius:var(--r-full);color:var(--ink-2);
    text-decoration:none;font-size:var(--fs-sm);font-weight:600;}
  .tabs a.on{background:var(--accent-soft);color:var(--accent);border-color:var(--accent-line);}
  .tabs a span{font-weight:500;color:var(--ink-3);}
  td.acts{text-align:right;white-space:nowrap;}
  td.acts .btn{min-height:32px;padding:0 var(--s3);}

  table{width:100%;border-collapse:collapse;font-size:var(--fs-sm);}
  th{text-align:left;font-weight:600;color:var(--ink-3);font-size:var(--fs-xs);text-transform:uppercase;
    letter-spacing:.04em;padding:var(--s2) var(--s3);border-bottom:1px solid var(--line);white-space:nowrap;}
  th[data-sort]{cursor:pointer;user-select:none;}
  th[data-sort]:hover{color:var(--accent);}
  th .arr{display:inline-block;width:1em;}
  td{padding:var(--s3);border-bottom:1px solid var(--line);vertical-align:middle;}
  tr.row{cursor:pointer;}
  tr.row:hover td{background:var(--accent-soft);}
  tr.off td{opacity:.55;}
  td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;}
  .name{font-weight:600;color:var(--ink);}
  .chip{display:inline-flex;align-items:center;gap:6px;border-radius:var(--r-full);padding:2px 10px;
    font-size:var(--fs-xs);font-weight:600;white-space:nowrap;}
  .chip.stale{background:var(--warn-soft);color:var(--warn-text);}
  .chip.never{background:var(--todo-soft);color:var(--todo-text);}
  .chip.fresh{background:var(--ok-soft);color:var(--ok-text);}
  .chip.off{background:var(--todo-soft);color:var(--todo-text);}
  .table-wrap{overflow-x:auto;}

  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:var(--s5);}
  @media (max-width:860px){.grid2{grid-template-columns:1fr;}}
  .kpis{display:flex;gap:var(--s4);flex-wrap:wrap;margin-bottom:var(--s5);}
  .kpi{flex:1;min-width:150px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:var(--s4) var(--s5);}
  .kpi b{display:block;font-family:'Literata',Georgia,serif;font-size:var(--fs-2xl);font-variant-numeric:tabular-nums;}
  .kpi span{color:var(--ink-3);font-size:var(--fs-sm);}

  .tasks .t{display:grid;grid-template-columns:32px minmax(0,1fr) 150px;gap:var(--s3);align-items:center;
    padding:6px 0;font-size:var(--fs-sm);}
  .tasks .t .n{font-family:'Literata',Georgia,serif;font-weight:700;color:var(--ink-2);}
  .tasks .t .tt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .bar{display:flex;height:8px;border-radius:var(--r-full);overflow:hidden;background:var(--track);}
  .bar i{display:block;height:100%;}
  .bar .g{background:var(--ok);} .bar .o{background:var(--warn);} .bar .b{background:var(--err);}
  .legend{display:flex;gap:var(--s4);flex-wrap:wrap;font-size:var(--fs-xs);color:var(--ink-3);margin-bottom:var(--s3);}
  .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:0;}
  .dot.g{background:var(--ok);} .dot.o{background:var(--warn);} .dot.b{background:var(--err);}

  .act{display:flex;align-items:flex-end;gap:3px;height:90px;}
  .act i{flex:1;background:var(--accent);border-radius:3px 3px 0 0;min-height:2px;opacity:.85;}
  .act i.z{background:var(--track);opacity:1;}
  .act-axis{display:flex;justify-content:space-between;font-size:var(--fs-2xs);color:var(--ink-3);margin-top:4px;}

  .list .it{display:flex;gap:var(--s3);justify-content:space-between;align-items:baseline;
    padding:var(--s2) 0;border-bottom:1px solid var(--line);font-size:var(--fs-sm);}
  .list .it:last-child{border-bottom:none;}
  .list .it .vres{flex:1;text-align:right;}
  .list .it .btn{min-height:32px;padding:0 var(--s3);}
  .list.cat .it{align-items:center;flex-wrap:wrap;}
  /* an assignment in the student card: the title with its status, the date and score on a line of their own
     (in one run of text the status chip landed mid-line and the next line began with a dot) */
  .asg-info{display:flex;flex-direction:column;gap:2px;flex:1 1 220px;min-width:0;}
  .asg-top{display:flex;gap:var(--s2);align-items:baseline;flex-wrap:wrap;}
  .chip.ex-open,.chip.ex-photos{background:var(--accent-soft);color:var(--accent);}
  .chip.ex-submitted{background:var(--warn-soft);color:var(--warn-text);}
  .chip.ex-checked{background:var(--ok-soft);color:var(--ok-text);}
  .chip.ex-missed{background:var(--err-soft);color:var(--err-text);}
  .chip.ex-scheduled{background:var(--todo-soft);color:var(--todo-text);}
  .acts-cell{white-space:nowrap;text-align:right;}
  .toolbar h3{margin-bottom:0;}
  .wrong .it{display:block;}
  .wrong .meta{display:flex;justify-content:space-between;gap:var(--s3);color:var(--ink-3);font-size:var(--fs-xs);}
  .wrong .cond{margin:6px 0;font-size:var(--fs-sm);color:var(--ink-2);}
  .wrong .cond img{max-width:260px;height:auto;filter:var(--img-filter);}
  .wrong .ans{font-size:var(--fs-sm);}
  .wrong .ans .given{color:var(--err-text);font-weight:600;}
  .wrong .ans .right{color:var(--ok-text);font-weight:600;}
  .wrong details summary{cursor:pointer;color:var(--accent);font-size:var(--fs-xs);}

  .sheet-ov{position:fixed;inset:0;background:rgba(20,18,14,.45);display:none;align-items:center;
    justify-content:center;z-index:100;padding:var(--s4);}
  .sheet-ov.open{display:flex;}
  .sheet{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--e3);padding:var(--s6);
    width:100%;max-width:480px;max-height:100%;overflow-y:auto;}
  .sheet h3{font-size:var(--fs-xl);margin-bottom:var(--s3);}
  .sheet p{color:var(--ink-2);font-size:var(--fs-sm);margin:0 0 var(--s4);}
  .sheet .acts{display:flex;gap:var(--s3);justify-content:flex-end;flex-wrap:wrap;margin-top:var(--s4);}
  .fld{display:flex;flex-direction:column;gap:var(--s2);margin:var(--s3) 0;font-size:var(--fs-sm);font-weight:500;}
  .fld select,.fld input{font:inherit;min-height:44px;padding:0 var(--s3);border:1px solid var(--line-strong);
    border-radius:var(--r-md);background:var(--input-bg);color:var(--ink);}
  .sheet .errline{margin:0;color:var(--err-text);font-size:var(--fs-sm);font-weight:500;}
  .sheet .errline:not(:empty){margin-top:var(--s3);}
  .sheet .btn{min-height:44px;}
  .btn:disabled{opacity:.55;cursor:default;}
  .field{width:100%;font:inherit;padding:10px 12px;border-radius:var(--r-sm);border:1px solid var(--line-strong);
    background:var(--input-bg);color:var(--ink);}
  .linkbox{word-break:break-all;font-family:ui-monospace,Menlo,monospace;font-size:var(--fs-xs);
    background:var(--surface-2);border-radius:var(--r-sm);padding:var(--s3);color:var(--ink-2);}
  /* the student's exam dashboard (same markup as the trainer's «Мои пробники» page, see exam-my-view.js) */
  .my-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:var(--s5);margin:0 0 var(--s4);}
  .my-card h3{margin:0 0 var(--s3);font-size:var(--fs-md);}
  .my-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;}
  .my-tbl{border-collapse:collapse;font-size:var(--fs-sm);font-variant-numeric:tabular-nums;}
  .my-tbl th,.my-tbl td{border:1px solid var(--line);min-width:42px;height:30px;padding:0 2px;text-align:center;font-weight:500;}
  .my-tbl th.my-n{position:sticky;left:0;background:var(--surface);min-width:34px;z-index:1;}
  .my-tbl .my-total th.my-n{min-width:60px;line-height:1.15;font-size:11px;}
  .my-tbl td.my-sol,.my-tbl th.my-sol{min-width:74px;background:var(--surface-2);}
  .my-tbl th.my-sol{font-size:var(--fs-xs);}
  .my-full{background:var(--ok-soft);color:var(--ok-text);}
  .my-part{background:var(--warn-soft);color:var(--warn-text);}
  .my-zero{background:var(--err-soft);color:var(--err-text);}
  .my-na{color:var(--ink-3);}
  .my-total td,.my-total th{font-weight:700;}
  .my-legend{margin:var(--s3) 0 0;font-size:var(--fs-xs);color:var(--ink-2);}
  .my-ch{display:block;}
  .my-ch.my-fit{width:100%;max-width:340px;height:auto;}
  .my-gl{stroke:var(--line);stroke-width:1;}
  .my-gt,.my-dt{fill:var(--ink-2);font-size:11px;}
  .my-vt{fill:var(--ink);font-size:12px;font-weight:600;}
  .my-line{fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round;}
  .my-dot{fill:var(--accent);}
  .my-list{display:flex;flex-direction:column;gap:var(--s2);}
  .my-row{display:flex;align-items:center;gap:var(--s3);width:100%;text-align:left;background:var(--surface-2);
    border:1px solid var(--line);border-radius:var(--r-md);padding:var(--s3) var(--s4);min-height:52px;}
  .my-r-t{display:block;font-weight:600;}
  .my-r-s{display:block;font-size:var(--fs-sm);color:var(--ink-2);margin-top:2px;}
  .my-r-body{flex:1;min-width:0;}
  /* check page */
  .ex-ph{display:flex;flex-wrap:wrap;gap:var(--s3);margin:var(--s4) 0;}
  .ex-ph a{display:block;max-width:100%;}
  .ex-ph img{height:180px;min-width:80px;width:auto;max-width:100%;object-fit:contain;border:1px solid var(--line);
    border-radius:var(--r-md);display:block;background:var(--surface-2);}
  .ck-fb{margin:var(--s4) 0;padding:var(--s3) var(--s4);border:1px dashed var(--line-strong);border-radius:var(--r-md);}
  .ck-fb h4{margin:0 0 var(--s2);font-size:var(--fs-sm);}
  .ck-fb .ex-ph{margin:var(--s2) 0;}.ck-fb .ex-ph:empty{display:none;}
  .ck-fbi{position:relative;display:inline-block;}
  .ck-fbx{position:absolute;top:4px;right:4px;width:30px;height:30px;padding:0;border-radius:var(--r-full);border:1px solid var(--line-strong);
    background:var(--surface);color:var(--ink);font-size:18px;line-height:1;cursor:pointer;}
  .ck-fb-act{display:flex;gap:var(--s3);align-items:center;flex-wrap:wrap;font-size:var(--fs-sm);}
  .ck-fb-msg{margin:var(--s2) 0 0;font-size:var(--fs-sm);color:var(--ink-2);}.ck-fb-msg:empty{display:none;}.ck-fb-msg.bad{color:var(--err-text);}
  .ck-row{display:flex;gap:var(--s4);flex-wrap:wrap;align-items:flex-start;}
  .ck-row .fld{margin:0;flex:0 0 140px;min-width:0;}
  .ck-row .fld.grow{flex:1 1 280px;}
  .ck-row textarea{resize:vertical;min-height:88px;}
  .ck-row textarea:disabled,.ck-row select:disabled{opacity:.6;}
  .ck-pre{white-space:pre-wrap;overflow-wrap:anywhere;}
  .ck-cond img{max-width:100%;height:auto;filter:var(--img-filter);}
  .tex{overflow-x:auto;overflow-y:hidden;}
  .ck-note{margin:var(--s3) 0 0;}

<script>
/* Панель преподавателя. Данные учеников сюда приходят только с сервера и
   только после входа по ссылке учителя; в самой странице их нет.
   Все цифры считает stats-core.js из журнала событий (см. sync-core.js). */
const API=/^(localhost|127\.0\.0\.1)$/.test(location.hostname)?'http://127.0.0.1:8090/api':'https://api.kirillnyun.space/api';
const AUTH_KEY='ege_teacher_auth_v1';
const TRAINER=location.origin+location.pathname.replace(/teacher\.html$/,'');
const DAY=86400000;
let auth=null;try{auth=JSON.parse(localStorage.getItem(AUTH_KEY));}catch(e){}
const app=document.getElementById('app');
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const taskTitle=n=>(TASKS.find(t=>t.n===n)||{}).title||('Задание '+n);

async function api(path,opt){opt=opt||{};
  const r=await fetch(API+path,{method:opt.method||'GET',body:opt.body&&JSON.stringify(opt.body),
    headers:Object.assign({'content-type':'application/json'},auth&&!opt.anon?{Authorization:auth.token}:{})});
  let json=null;try{json=await r.json();}catch(e){}
  if(r.status===401&&!opt.anon){expire();throw new Error('401');}
  return{status:r.status,json:json};}
async function all(c,filter,fields,sort){
  const out=[];
  for(let page=1;;page++){
    const r=await api(`/collections/${c}/records?perPage=500&page=${page}&skipTotal=1&sort=${sort||'created'}`+(filter?'&filter='+encodeURIComponent(filter):'')+(fields?'&fields='+encodeURIComponent(fields):''));
    if(r.status!==200)throw new Error(c+' '+r.status);
    out.push(...r.json.items);if(r.json.items.length<500)return out;
  }}

// ---- вход ----
/* Signing out (or an expired session) drops everything loaded for the teacher, so that Back
   cannot redraw cached student data without a session. */
function logout(msg){auth=null;try{localStorage.removeItem(AUTH_KEY);}catch(e){}
  data=null;for(const k in summaries)delete summaries[k];for(const k in myExams)delete myExams[k];
  ckGen++;ckShown=null;ck=null;ckNote=null;ckTok={v:'',t:0};ckTokP=null;
  try{closeSheet();}catch(e){}
  render(msg);}
/* A link such as teacher.html#/check/<id> (from the bot) opened without a valid session: the
   route is kept for this tab and restored once after the next successful login. */
const PEND_KEY='ege_teacher_pending_hash';
const PEND_OK=/^#\/(?:(?:s|check)\/[a-z0-9]+|leads|exams|bot)$/;
function pendSave(){if(!PEND_OK.test(location.hash))return;try{sessionStorage.setItem(PEND_KEY,location.hash);}catch(e){}}
function pendTake(){let h=null;try{h=sessionStorage.getItem(PEND_KEY);sessionStorage.removeItem(PEND_KEY);}catch(e){}return h&&PEND_OK.test(h)?h:null;}
const EXPIRED='Вход больше не действует. Открой свою ссылку преподавателя.';
function expire(){pendSave();logout(EXPIRED);}
async function loginFromHash(){
  const m=location.hash.match(/^#\/login\/([a-z0-9_-]+)\.([A-Za-z0-9]+)$/);
  if(!m)return;
  history.replaceState(null,'',location.pathname);
  app.innerHTML='<p class="center muted">Вход…</p>';
  let r;
  try{r=await api('/collections/users/auth-with-password',{method:'POST',anon:true,body:{identity:m[1],password:m[2]}});}
  catch(e){render('Нет связи с сервером.');return;}
  if(r.status!==200){render('Ссылка не подошла.');return;}
  if(r.json.record.role!=='teacher'){render('Эта страница только для преподавателя.');return;}
  auth={token:r.json.token,id:r.json.record.id,name:r.json.record.name};
  try{localStorage.setItem(AUTH_KEY,JSON.stringify(auth));}catch(e){}
  const h=pendTake();if(h)history.replaceState(null,'',location.pathname+h);   // back to the page the link was for
}

// ---- данные ----
let data=null;   // {students, links, byUser:{id:{events,variants,clears}}}
/* Student = role "student" with no bot profile (old link accounts) or with a
   profile marked `mine`. Everyone else who came through the bot is a lead:
   only the summary from /ege/leads is loaded for them, never their journals. */
async function load(){
  const [users,links,pr]=await Promise.all([all('users','role="student"'),all('links'),api('/ege/leads')]);
  if(pr.status!==200)throw new Error('leads '+pr.status);
  const profOf={};pr.json.items.forEach(p=>profOf[p.user]=p);
  const students=users.filter(u=>!profOf[u.id]||profOf[u.id].mine);
  const byUser={};
  students.forEach(u=>byUser[u.id]={events:[],variants:[],clears:[]});
  const ids=students.map(u=>u.id),filters=[];
  for(let i=0;i<ids.length;i+=30)filters.push(ids.slice(i,i+30).map(id=>`user="${id}"`).join('||'));
  const own=async c=>(await Promise.all(filters.map(f=>all(c,f)))).flat();
  const [events,variants,clears]=await Promise.all([own('events'),own('variants'),own('variant_clears')]);
  events.forEach(e=>byUser[e.user]&&byUser[e.user].events.push(e));
  variants.forEach(v=>byUser[v.user]&&byUser[v.user].variants.push(v));
  clears.forEach(c=>byUser[c.user]&&byUser[c.user].clears.push(c));
  const linkOf={};links.forEach(l=>linkOf[l.user]=l);
  const userOf={};users.forEach(u=>userOf[u.id]=u);
  data={students,leads:pr.json.items.filter(p=>!p.mine),profOf,userOf,linkOf,byUser,loaded:Date.now()};
  /* Exams: a server without the exam collections must not break the panel
     (any error except a 401 gives an empty list). `tasks`/`key` of exams and
     `log` of assignments are never requested here — hence the field lists. */
  const bad=[];   // statuses of failures other than "collection not found"
  const soft=p=>p.catch(e=>{if(e.message==='401')throw e;
    const m=/ (\d+)$/.exec(e.message);if(!m||m[1]!=='404')bad.push(m?m[1]:'net');return [];});
  const [exams,asg,photos]=await Promise.all([
    soft(all('exams',null,'id,title,full,created','created,id')),
    soft(all('exam_assignments',null,'id,user,exam,start,duration,opened,finished,photos_done,settled,checked,p1,created')),
    soft(all('exam_photos',null,'id,assignment,user,n,file'))]);
  data.exams=exams;data.asg=asg;data.photos=photos;data.examErr=bad[0]||null;
}
/* A lead's journal is fetched only when their card is opened. */
async function loadOne(id){
  const f=`user="${id}"`;
  const [events,variants,clears]=await Promise.all([all('events',f),all('variants',f),all('variant_clears',f)]);
  data.byUser[id]={events,variants,clears};
}
const cfg={
  protoOf(n,pid){const pl=protoList(n);if(!pl)return null;const g=pl.find(g=>g.ids.includes(pid));return g?g.p:null;},
  reps(n){const pl=protoList(n);return pl?pl.map(g=>g.ids[0]):null;},
  count(n){const t=TASKS.find(t=>t.n===n);return t?t.count:0;},
};
const summaries={};
const myExams={};   // student id -> exam summary rows (ExamMyView items)
function summaryOf(u){
  if(!summaries[u.id]){const d=data.byUser[u.id];
    summaries[u.id]=StatsCore.studentSummary(d.events,d.variants,d.clears,Date.now(),cfg);}
  return summaries[u.id];}

function ago(ts){
  if(ts==null)return'<span class="chip never">не заходил</span>';
  const d0=StatsCore.mskDay(Date.now()),d=StatsCore.mskDay(ts);
  const diff=Math.round((Date.parse(d0)-Date.parse(d))/DAY);
  const txt=diff===0?'сегодня':diff===1?'вчера':diff+' дн. назад';
  return `<span class="chip ${diff>=7?'stale':'fresh'}">${txt}</span>`;
}
const fmtDate=ts=>new Date(ts).toLocaleString('ru-RU',{timeZone:'Europe/Moscow',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
const fmtDay=ts=>new Date(ts).toLocaleDateString('ru-RU',{timeZone:'Europe/Moscow',day:'numeric',month:'short'});

// the third tab's badge counts works waiting for a check (nothing when there are none)
const tabs=cur=>{const wait=(data.asg||[]).filter(a=>phaseOf(a)==='submitted').length;
  return `<div class="tabs">
  <a href="#/" class="${cur==='s'?'on':''}">Ученики <span>${data.students.length}</span></a>
  <a href="#/leads" class="${cur==='l'?'on':''}">Из канала <span>${data.leads.length}</span></a>
  <a href="#/exams" class="${cur==='x'?'on':''}">Пробники${wait?` <span>${wait}</span>`:''}</a>
  <a href="#/bot" class="${cur==='b'?'on':''}">Бот</a></div>`;};
/* Telegram usernames are [A-Za-z0-9_]; anything else is shown as plain text. */
const tgLink=un=>/^[A-Za-z0-9_]{1,64}$/.test(un||'')?`<a href="https://t.me/${un}" target="_blank" rel="noopener">@${un}</a>`:'<span class="muted">—</span>';
const pbTime=s=>s?Date.parse(String(s).replace(' ','T')):null;

// ---- пробники от преподавателя ----
const nowS=()=>Math.floor(Date.now()/1000);
const examOf=id=>(data.exams||[]).find(e=>e.id===id);
// the catalog is numbered by upload order: the owner says "пробник 3"
const examNo=id=>(data.exams||[]).findIndex(e=>e.id===id)+1;
const examLabel=e=>`№${examNo(e.id)} · ${e.title}`;
const nameOf=uid=>{const u=(data.userOf||{})[uid];return u?(u.name||u.login):'—';};
const phaseOf=a=>ExamCore.phase({start:a.start,duration:a.duration,opened:a.opened,finished:a.finished,photos_done:a.photos_done,checked:a.checked},nowS());
const asgOfUser=uid=>(data.asg||[]).filter(a=>a.user===uid);
const photosOfAsg=id=>(data.photos||[]).filter(p=>p.assignment===id);
// timestamps in seconds; anything that is not a sane number is shown as a dash
const fmtTs=ts=>{const v=Number(ts);return Number.isFinite(v)&&v>0&&Number.isFinite(new Date(v*1000).getTime())?fmtDate(v*1000):'—';};
const chipFor=ph=>`<span class="chip ex-${ph}">${ExamPanelCore.PHASE_TEXT[ph]}</span>`;

// ---- список учеников ----
let sortKey='last',sortDir=-1;
function rowData(u){const s=summaryOf(u),lastV=s.variants[s.variants.length-1];
  let g=0;for(let n=1;n<=20;n++)g+=s.byTask[n].g;
  return{u,last:s.lastActive,week:s.solved7d,mastered:g,mock:lastV?lastV.s:null,mockT:lastV?lastV.t:null};}
function renderList(){
  const rows=data.students.map(rowData);
  const val=r=>sortKey==='name'?(r.u.name||r.u.login).toLowerCase():r[sortKey];
  rows.sort((a,b)=>{const x=val(a),y=val(b);
    if(x==null&&y==null)return 0;if(x==null)return 1;if(y==null)return -1;
    return (x<y?-1:x>y?1:0)*sortDir;});
  rows.sort((a,b)=>(a.u.active===false)-(b.u.active===false));
  const th=(k,label,cls)=>`<th data-sort="${k}" class="${cls||''}">${label}<span class="arr">${sortKey===k?(sortDir>0?'↑':'↓'):''}</span></th>`;
  app.innerHTML=`${tabs('s')}
    <h2>Ученики</h2>
    <p class="lead">Активных учеников: ${data.students.filter(u=>u.active!==false).length}. Нажми на ученика, чтобы открыть его карточку.</p>
    <div class="panel">
      <div class="toolbar"><div class="grow muted">Обновлено ${fmtDate(data.loaded)}</div>
        <button class="btn quiet" data-act="reload">Обновить</button></div>
      ${rows.length?`<div class="table-wrap"><table>
        <thead><tr>${th('name','Ученик')}${th('last','Последняя активность')}${th('week','Решено за 7 дней','num')}${th('mastered','Умею','num hide-m')}${th('mock','Последний пробник','num')}</tr></thead>
        <tbody>${rows.map(r=>`<tr class="row${r.u.active===false?' off':''}" data-open="${r.u.id}">
          <td><span class="name">${esc(r.u.name||r.u.login)}</span>${r.u.active===false?' <span class="chip off">отключён</span>':''}</td>
          <td>${ago(r.last)}</td>
          <td class="num">${r.week}</td>
          <td class="num hide-m">${r.mastered}</td>
          <td class="num">${r.mock==null?'<span class="muted">—</span>':`<b>${r.mock}</b> <span class="muted">· ${fmtDay(r.mockT)}</span>`}</td>
        </tr>`).join('')}</tbody></table></div>`
      :'<p class="center muted">Учеников пока нет. Открой вкладку «Из канала» и нажми «В мои ученики» у нужного человека.</p>'}
    </div>`;
}

// ---- пришедшие из канала ----
function renderLeads(){
  const rows=data.leads;
  app.innerHTML=`${tabs('l')}
    <p class="lead">Зарегистрировались через бота: ${rows.length}. Нажми на человека, чтобы открыть его статистику. «В мои ученики» переносит его в основной список.</p>
    <div class="panel">
      <div class="toolbar"><div class="grow muted">Обновлено ${fmtDate(data.loaded)}</div>
        <button class="btn quiet" data-act="reload">Обновить</button></div>
      ${rows.length?`<div class="table-wrap"><table>
        <thead><tr><th>Имя</th><th>Telegram</th><th class="hide-m">Регистрация</th><th class="num">Отметок</th><th>Последняя активность</th><th></th></tr></thead>
        <tbody>${rows.map(p=>`<tr class="row${p.active?'':' off'}" data-open="${esc(p.user)}">
          <td><span class="name">${esc(p.name)}</span>${p.active?'':' <span class="chip off">отключён</span>'}</td>
          <td>${tgLink(p.username)}</td>
          <td class="hide-m">${fmtDay(pbTime(p.created))}</td>
          <td class="num">${Number(p.marks)||0}</td>
          <td>${ago(pbTime(p.last))}</td>
          <td class="acts"><button class="btn" data-act="mine" data-id="${esc(p.id)}" data-v="1">В мои ученики</button>
            <button class="btn quiet" data-act="active" data-id="${esc(p.user)}" data-v="${p.active?0:1}">${p.active?'Отключить':'Включить'}</button></td>
        </tr>`).join('')}</tbody></table></div>`
      :'<p class="center muted">Пока никто не зарегистрировался через бота.</p>'}
    </div>`;
}

// ---- журнал бота ----
/* Everything the bot sent, newest first. Loaded when the tab opens (not with the rest of the
   data): the journal grows with every message. Sign-in codes are masked on the server. */
async function renderBot(){
  const gen=++botGen,alive=()=>gen===botGen&&location.hash==='#/bot';
  app.innerHTML=`${tabs('b')}<p class="center muted">Загружаю…</p>`;
  const r=await api('/collections/bot_messages/records?perPage=200&skipTotal=1&sort=-created');
  if(!alive())return;
  if(r.status!==200){app.innerHTML=`${tabs('b')}<p class="center muted">Не удалось загрузить журнал (код ${esc(r.status)}).</p>`;return;}
  const rows=r.json.items;
  app.innerHTML=`${tabs('b')}
    <p class="lead">Всё, что бот отправлял: последние ${rows.length>=200?'200':rows.length}. Журнал ведётся с момента выкладки этой версии, раньше сообщения не записывались. Коды для входа скрыты.</p>
    <div class="panel">
      <div class="toolbar"><div class="grow muted">Обновлено ${fmtDate(Date.now())}</div><button class="btn quiet" data-act="reload">Обновить</button></div>
      ${rows.length?`<div class="table-wrap"><table>
        <thead><tr><th>Когда</th><th>Кому</th><th>Сообщение</th><th>Статус</th></tr></thead>
        <tbody>${rows.map(m=>`<tr>
          <td>${fmtDate(pbTime(m.created))}</td>
          <td>${m.user?esc(nameOf(m.user)):'<span class="muted">тебе</span>'}</td>
          <td style="white-space:pre-wrap">${esc(m.text)}${m.label?` <span class="chip">${esc(m.label)}</span>`:''}</td>

let sending=false;
async function sendExam(kind,path,body,btn){
  const err=document.getElementById('as-err');

  }finally{sending=false;}   // never left set: a stuck flag would silence every later exam action
  if(r.status!==200){
    err.textContent=fmtErr(kind,r.status);btn.disabled=false;
    if(r.status===409||r.status===404){
      // nothing can be done with this assignment any more: only "Закрыть" is left, the fields are locked
      // (Enter in a field must do nothing), and the lists are refreshed behind the sheet
      const acts=btn.closest('.acts');if(acts)acts.innerHTML='<button type="button" class="btn" data-act="close">Закрыть</button>';
      document.querySelectorAll('#as-form input,#as-form select').forEach(x=>{x.disabled=true;});
      refreshKeep().catch(()=>{});}
    return;}

async function fbShrink(file){
  const okType=/^image\/(png|jpeg|webp)$/.test(file.type);
  let bmp;try{bmp=await createImageBitmap(file,{imageOrientation:'from-image'});}catch(e){return null;}
  const big=Math.max(bmp.width,bmp.height)>2000;
  if(okType&&!big&&file.size<=3*1024*1024){bmp.close&&bmp.close();return file;}
  const k=big?2000/Math.max(bmp.width,bmp.height):1,c=document.createElement('canvas');

  if(room<=0){fbMsg(i,`Уже ${FB_MAX} фото: лишнее можно убрать крестиком.`,true);return;}

    <p class="lead">Начало: ${T(start)} (по Москве) · на работу ${Math.round(dur/60)} мин · ${numOr(a.opened,0)>0?'открыл: '+T(a.opened):'не открывал'}${numOr(a.finished,0)>0?' · завершил досрочно: '+T(a.finished):''}${numOr(a.photos_done,0)>0?' · закончил с фото: '+T(a.photos_done):''}</p>
    ${phs?'':'<p class="muted">Не удалось обновить список фото.</p>'}
    ${ready?'':`<div class="panel"><p class="muted" role="status">${notReady}</p></div>`}
    <div class="panel"><h3>Активность</h3>
      <p>${away}.</p>
      <p class="muted">Это только факты из журнала сайта, не доказательство: второй телефон или книгу сайт не видит.</p>
      <details class="ck-tl"><summary>Когда вводились ответы</summary>${tlTasks.length?tlTasks.map(n=>`<h4>Задание ${esc(n)}</h4><div class="list">${byTask[n].map(x=>
        `<div class="it tl"><span class="muted">${P.fmtSec(x[0]-start)}</span><span class="ck-pre">${String(x[3])===''?'<span class="muted">стёр ответ</span>':esc(x[3])}</span></div>`).join('')}</div>`).join(''):'<p class="muted">Ответов по журналу нет.</p>'}</details>
      ${aways.length?`<details class="ck-tl"><summary>Уходы со страницы</summary><div class="list">${aways.map(x=>
        `<div class="it"><span>Задание ${esc(x[2])||'—'}</span><span class="muted">не было на странице ${P.fmtSec(x[3])} · записано на ${P.fmtSec(x[0]-start)} от начала</span></div>`).join('')}</div></details>`:''}</div>
    <div class="panel"><h3>Первая часть: ${ready?esc(numOr(a.p1,0)):'—'} из ${short.reduce((s,t)=>s+t.max,0)}</h3>
      ${short.length?`<div class="table-wrap ck-p1"><table><thead><tr><th>Задание</th><th>Ответ ученика</th><th>Верный ответ</th><th></th></tr></thead><tbody>
      ${short.map(t=>{const g=txt(own(answers,t.n));return `<tr><td class="c-n">${esc(t.n)}</td><td class="c-g ck-pre">${g?esc(g):'<span class="muted">—</span>'}</td><td class="c-k ck-pre">${esc(txt(keyOf(t.n).a))}</td>
        <td class="c-v">${ready?(own(ok,t.n)?'<span class="chip ex-checked">верно</span>':'<span class="chip ex-missed">неверно</span>'):''}</td></tr>`;}).join('')}</tbody></table></div>`:'<p class="muted">В этом пробнике нет заданий с кратким ответом.</p>'}</div>
    ${long.map((t,i)=>{const g0=own(part2,t.n),g=isObj(g0)?g0:{},ps=photos.filter(p=>String(p.n)===t.n),max=t.max,cur=Math.min(max,Math.max(0,Math.trunc(numOr(g.pts,0))));
      return `<div class="panel" data-ck="${i}"><h3>Задание ${esc(t.n)} <span class="muted">· максимум ${esc(max)}</span></h3>
        <details><summary>Условие и верный ответ</summary>${examHtml(t.cond,'условии','ck-cond')}<p><b>Ответ:</b></p>${examHtml(txt(keyOf(t.n).a),'ответе')}</details>
        <div class="ex-ph">${ps.length?ps.map(p=>phThumb(p,tok,`Фото решения, задание ${t.n}`)).join(''):`<p class="muted">${botPh.length?'К этому заданию фото на сайте нет. Смотри блок «Фото, присланные боту» ниже.':'Фото нет.'}</p>`}</div>
        <div class="ck-fb" data-ck-fb="${i}"><h4>Фото к комментарию <span class="muted">· ученик увидит их после проверки</span></h4>
          <div class="ex-ph ck-fb-list" data-fb-list="${i}">${fbItems(fb.filter(p=>String(p.n)===t.n),tok)}</div>
          <div class="ck-fb-act"><button type="button" class="btn quiet" data-fbadd="${i}" ${ready?'':'disabled'}>Добавить фото</button>
            <input type="file" hidden multiple accept="image/*" data-fbfile="${i}">
            <span class="muted">или вставь снимок из буфера (Cmd+V) в поле комментария, или перетащи файл сюда</span></div>
          <p class="ck-fb-msg" data-fb-msg="${i}" role="status"></p></div>
        <div class="ck-row"><label class="fld">Баллы<select data-ck-pts="${i}" ${ready?'':'disabled'}>${pointsOptions(max,cur)}</select></label>
          <label class="fld grow">Комментарий ученику<textarea class="field" data-ck-note="${i}" rows="3" maxlength="2000" ${ready?'':'disabled'}>${esc(txt(g.comment))}</textarea></label></div></div>`;}).join('')}
    <div class="panel"><h3>Общий комментарий <span class="muted">· ученик увидит его над разбором заданий</span></h3>
      <label class="fld grow"><textarea class="field" data-ck-general rows="4" maxlength="3000" ${ready?'':'disabled'}>${esc(txt(part2._general))}</textarea></label></div>
    ${botPh.length?`<div class="panel"><h3>Фото, присланные боту <span class="muted">· ${botPh.length}</span></h3>
      <p class="muted">Ученик отправил их боту без указания задания. Они в порядке получения.</p>
      <div class="ex-ph">${botPh.map(p=>phThumb(p,tok,'Фото, присланное боту')).join('')}</div></div>`:''}
    <div class="toolbar"><p class="ck-msg grow${ckNote&&ckNote.id===id&&ckNote.bad?' bad':ckNote&&ckNote.id===id?' good':''}" id="ck-msg" role="status">${ckNoteHtml(id)}</p>
      <button class="btn" data-act="check-send" data-id="${esc(id)}" ${ready?'':'disabled'}>${a.checked?'Сохранить изменения':'Проверено, отправить ученику'}</button></div>
    <p class="muted ck-note">Ученик получит сообщение в Telegram при первой проверке.${a.checked?' Повторное сохранение только обновляет баллы и комментарии.':''}</p>`;
  ck={id,long:long.map(t=>({n:t.n})),checked:!!a.checked,fb:fb.slice()};ckShown=id;
  const dr=P.readDraft(ckStore(),P.draftKey(id));
  if(dr&&ready&&P.draftDiffers(dr,part2)){
    long.forEach((t,i)=>{const s=document.querySelector(`[data-ck-pts="${i}"]`),c=document.querySelector(`[data-ck-note="${i}"]`);
      if(s&&Object.prototype.hasOwnProperty.call(dr.pts,t.n)&&[...s.options].some(o=>o.value===String(dr.pts[t.n])))s.value=String(dr.pts[t.n]);
      if(c&&Object.prototype.hasOwnProperty.call(dr.note,t.n))c.value=dr.note[t.n];});
    const gc=document.querySelector('[data-ck-general]');
    if(gc&&dr.general)gc.value=dr.general;
    const m=document.getElementById('ck-msg');
    if(m&&!(ckNote&&ckNote.id===id)){m.textContent='Восстановлен черновик: баллы и комментарии, которые ты не успел отправить.';m.className='ck-msg grow';}
  }
  // only the teacher's own HTML is typeset; student answers stay plain text
  if(window.renderMathInElement)app.querySelectorAll('.tex').forEach(el=>{try{renderMathInElement(el,{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],throwOnError:false});}catch(err){}});
  if(keepY!==null){window.scrollTo(0,keepY);keepY=null;}
}
const ckErr=st=>st===409?'Работа ещё не сдана. Баллы можно будет поставить после сдачи.'
  :st===400?'Проверь баллы: целые числа от нуля до максимума.'
  :st===403?'Нет доступа: вход мог истечь. Открой свою ссылку преподавателя заново.'
  :st===404?'Такой работы уже нет, возможно, пробник отменили.'
  :`Сервер ответил ${st}.`;
/* Same double-submit guard as the assign sheet: the `sending` flag is released in `finally`,
   the button is off while the request runs. The status line survives the redraw (ckNote). */
async function checkSend(id,btn){
  const msg=document.getElementById('ck-msg');
  if(sending||!btn||btn.disabled||!msg||!ck||ck.id!==id)return;
  const say=(text,bad)=>{ckNote={id,text,bad:!!bad};msg.textContent=text;msg.className='ck-msg grow '+(bad?'bad':'good');};
  /* controls are found by position, never by building a selector from the task number (which is data) */
  const part2=Object.create(null);
  ck.long.forEach((t,i)=>{const s=document.querySelector(`[data-ck-pts="${i}"]`),c=document.querySelector(`[data-ck-note="${i}"]`);
    if(s&&c)part2[t.n]={pts:Number(s.value),comment:c.value};});
  const gen=document.querySelector('[data-ck-general]'),general=gen?gen.value:'';
  const first=!ck.checked;
  let r;
  sending=true;
  try{
    btn.disabled=true;say('Отправляю…');
    try{r=await api(`/ege/exams/${id}/check`,{method:'POST',body:{part2,general}});}
    catch(err){if(err.message!=='401'){say('Нет связи с сервером. Ничего не сохранено.',true);btn.disabled=false;}return;}
  }finally{sending=false;}
  if(r.status!==200){
    say(ckErr(r.status),true);
    if(r.status===409||r.status===404)refreshKeep().catch(()=>{});   // the state changed: redraw it, the message stays
    else btn.disabled=false;
    return;}
  ExamPanelCore.writeDraft(ckStore(),ExamPanelCore.draftKey(id),null);
  say(`${first?'Готово. Работа проверена, ученик получит сообщение в Telegram.':'Изменения сохранены, новое сообщение ученику не уходит.'} ${mskTime(Date.now())}`);
  try{await refreshKeep();}catch(err){if(err.message!=='401')say('Сохранено, но список не обновился. Обнови страницу.',true);}
}

// ---- маршруты ----
async function refresh(){await load();if(!auth){data=null;return;}for(const k in summaries)delete summaries[k];route();}
/* Refresh that keeps the scroll position (route() otherwise scrolls to the top): after an
   exam action the changed row is usually mid-page. A lead's card is drawn after its journal
   arrives (renderStudent), so the position is kept until that second draw. */
let keepY=null;
async function refreshKeep(y){
  keepY=y===undefined?window.scrollY:y;
  try{await refresh();}catch(e){keepY=null;throw e;}
  if(keepY!==null){window.scrollTo(0,keepY);
    const m=location.hash.match(/^#\/s\/([a-z0-9]+)$/);
    // the check page and a lead's card draw after a request: they apply the scroll themselves
    if(!(/^#\/check\/[a-z0-9]+$/.test(location.hash)||(m&&!data.byUser[m[1]])))keepY=null;}
}
function route(){
  const m=location.hash.match(/^#\/s\/([a-z0-9]+)$/);
  const mc=location.hash.match(/^#\/check\/([a-z0-9]+)$/);
  if(!mc){ckShown=null;ckGen++;}   // leaving the check page: a draw still in flight must not paint over the new page
  if(mc)renderCheck(mc[1]).catch(err=>{keepY=null;ckShown=null;if(err.message!=='401')app.innerHTML=`<p class="center muted">Не удалось открыть работу: ${esc(err.message)}</p>`;});
  else if(m)renderStudent(m[1]);else if(location.hash==='#/leads')renderLeads();else if(location.hash==='#/bot')renderBot().catch(err=>{if(err.message!=='401')app.innerHTML=`${tabs('b')}<p class="center muted">Не удалось загрузить журнал: ${esc(err.message)}</p>`;});else if(location.hash==='#/exams')renderExams();else renderList();
  if(keepY===null)window.scrollTo(0,0);
}
function render(msg){
  document.getElementById('logout').style.display=auth?'':'none';
  if(!auth){app.innerHTML=`<div class="center"><h2>Панель преподавателя</h2><p class="lead">${esc(msg||'Открой свою личную ссылку для входа.')}</p></div>`;return;}
  app.innerHTML='<p class="center muted">Загружаю данные…</p>';
  refresh().catch(e=>{
    if(/ (401|403)$/.test(e.message))return expire();   // a token the server no longer accepts
    if(e.message!=='401')app.innerHTML=`<p class="center muted">Не удалось загрузить данные: ${esc(e.message)}</p>`;});
}

document.addEventListener('click',e=>{
  const th=e.target.closest('th[data-sort]');
  if(th){const k=th.dataset.sort;if(sortKey===k)sortDir=-sortDir;else{sortKey=k;sortDir=k==='name'?1:-1;}renderList();return;}
  const fba=e.target.closest('[data-fbadd]');
  if(fba){const f=document.querySelector(`[data-fbfile="${fba.dataset.fbadd}"]`);if(f)f.click();return;}
  const fbx=e.target.closest('[data-fbdel]');
  if(fbx){fbDelete(fbx.dataset.fbdel,fbx);return;}
  const pa=e.target.closest('a[data-ph]');
  if(pa){openPhoto(e,pa);return;}
  const b=e.target.closest('[data-act]');
  if(!b){
    /* buttons and the Telegram link inside a row must not open the card */
    const row=e.target.closest('[data-open]');
    if(row&&!e.target.closest('a'))location.hash='#/s/'+row.dataset.open;
    return;}
  const a=b.dataset.act,id=b.dataset.id;
  if(a==='reload')refresh();
  else if(a==='close')closeSheet();
  else if(a==='copy')navigator.clipboard.writeText(b.dataset.url).then(()=>{b.textContent='Скопировано';});
  else if(a==='link'){const l=data.linkOf[id],u=data.students.find(x=>x.id===id);
    if(l)showLink(u,l.secret,'Ссылка для входа');else rotate(id);}
  else if(a==='rotate')rotate(id);
  else if(a==='rotate-go')rotateGo(id);
  else if(a==='mine')setMine(id,b.dataset.v==='1');
  else if(a==='active')setActive(id,b.dataset.v==='1');
  else if(a==='vdel')delVariant(b.dataset.user,id);
  else if(a==='vdel-go')delVariantGo(b.dataset.user,id);
  else if(a==='open-check')location.hash='#/check/'+id;
  else if(a==='check-send')checkSend(id,b);
  else if(a==='assign')assignSheet({exam:b.dataset.exam,user:b.dataset.user});
  else if(a==='past-go')pastGo(b);
  else if(a==='past-back')pastBack();
  else if(a==='move')moveSheet(id);
  else if(a==='cancel')cancelSheet(id);
  else if(a==='cancel-go')cancelGo(id,b);
});
document.getElementById('sheet-ov').addEventListener('click',e=>{if(e.target.id==='sheet-ov')closeSheet();});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet();});
document.getElementById('home').addEventListener('click',()=>{location.hash='#/';});
document.getElementById('logout').addEventListener('click',()=>logout('Ты вышел. Чтобы войти снова, открой свою ссылку.'));
document.getElementById('theme').addEventListener('click',()=>{
  const dark=document.documentElement.getAttribute('data-theme')==='dark';
  if(dark)document.documentElement.removeAttribute('data-theme');else document.documentElement.setAttribute('data-theme','dark');
  try{localStorage.setItem('ege_theme',dark?'light':'dark');}catch(e){}
  document.querySelector('meta[name="theme-color"]').setAttribute('content',dark?'#f2efe7':'#161713');});
/* Enter in a field and the submit button both land here (assign and move sheets). */
document.addEventListener('submit',e=>{
  const f=e.target;if(!f.matches||!f.matches('#as-form'))return;
  e.preventDefault();const b=f.querySelector('button[type="submit"]');
  if(!b||b.disabled)return;
  if(f.dataset.kind==='assign')assignGo(b);else moveGo(f.dataset.id,b);
});
window.addEventListener('hashchange',async()=>{keepY=null;ckNote=null;
  if(/^#\/login\//.test(location.hash)){await loginFromHash();render();return;}
  if(data&&auth)route();});
(async()=>{if(!auth)pendSave();await loginFromHash();render();})();
</script>
