<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Пилот разборов — черновик на проверку</title>
<!-- Draft for the owner's review only. Not linked from the trainer.
     Conditions are read live from img/tN/data.js; the new solutions are in PILOT below. -->
<base href="../../">
<link rel="stylesheet" href="katex/katex.min.css">
<script defer src="katex/katex.min.js"></script>
<script defer src="katex/auto-render.min.js"></script>
<style>
  body{font:17px/1.55 -apple-system,'Segoe UI',sans-serif;color:#1c1c1e;background:#f5f4f1;margin:0;padding:24px 16px 64px;}
  main{max-width:780px;margin:0 auto;}
  h1{font-size:26px;margin:0 0 8px;}
  .lead{color:#555;margin:0 0 28px;}
  .task{background:#fff;border:1px solid #dedbd4;border-radius:12px;padding:20px 22px;margin:0 0 22px;}
  .task h2{font-size:15px;font-weight:600;color:#666;margin:0 0 10px;letter-spacing:.02em;}
  .cond img{max-width:280px;height:auto;display:block;margin:10px 0;}
  .label{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin:18px 0 6px;}
  .now .label{color:#a35b00;}
  .new .label{color:#1f5fbf;}
  .now{border-top:1px solid #e6e3dc;margin-top:14px;}
  .now p{color:#555;margin:0 0 6px;}
  details{margin:6px 0 0;}
  summary{cursor:pointer;color:#555;}
  .old{background:#faf9f6;border-radius:8px;padding:10px 14px;margin-top:8px;overflow-x:auto;}
  .old img{max-width:100%;height:auto;vertical-align:middle;}
  .old .math-display{text-align:center;}
  .new{border-top:1px solid #e6e3dc;}
  .new ol{padding-left:22px;margin:8px 0;}
  .new li{margin:0 0 8px;}
  .idea{background:#eef4fd;border-radius:8px;padding:10px 14px;margin:0 0 10px;}
  .trap{background:#fdf3e4;border-radius:8px;padding:10px 14px;margin:10px 0;}
  .ans{font-weight:700;margin:10px 0 0;}
  .katex-display{overflow-x:auto;overflow-y:hidden;margin:.5em 0;}
</style>
</head>
<body>
<main>
<h1>Пилот разборов</h1>
<p class="lead">Восемь разнотипных задач. У каждой: условие, что ученик видит сейчас, и новый разбор.
Формат нового: идея — шаги по одному действию — где ошибаются (только если есть типичная ошибка) — ответ.
Все числа и ответы сверены расчётом с ответом из банка.</p>
<div id="list"></div>
</main>

<script>
/* n — task number, id — 1-based position in img/tN/data.js. */
const PILOT = [
{n:1,id:41,html:`
<div class="idea"><b>Идея.</b> Медиана, проведённая к гипотенузе, равна её половине — из-за этого появляется равнобедренный треугольник. А биссектриса прямого угла отрезает от него $45^\\circ$.</div>
<ol>
<li>$CM$ — медиана к гипотенузе, поэтому $CM = MB$. Треугольник $CMB$ равнобедренный, углы при стороне $CB$ равны: $\\angle MCB = \\angle B = 66^\\circ$.</li>
<li>$CD$ — биссектриса прямого угла: $\\angle DCB = 90^\\circ : 2 = 45^\\circ$.</li>
<li>Оба угла отложены от одной стороны $CB$, поэтому угол между медианой и биссектрисой — их разность: $\\angle MCD = 66^\\circ - 45^\\circ = 21^\\circ$.</li>
</ol>
<p class="ans">Ответ: 21</p>`},

{n:3,id:61,html:`
<div class="idea"><b>Идея.</b> Пять точек, четыре из которых лежат в одной грани, — это пирамида: грань служит основанием, пятая точка — вершиной.</div>
<ol>
<li>Основание — прямоугольник $ABCD$ со сторонами $BC = 9$ и $CD = 3$. Его площадь $S = 9 \\cdot 3 = 27$.</li>
<li>Вершина пирамиды — точка $C_1$. Ребро $CC_1$ перпендикулярно основанию, значит, оно и есть высота: $h = 7$.</li>
<li>Объём пирамиды: $V = \\dfrac13 S h = \\dfrac13 \\cdot 27 \\cdot 7 = 63$.</li>
</ol>
<div class="trap"><b>Где ошибаются.</b> Забывают множитель $\\dfrac13$ и получают $189$ — это объём всего параллелепипеда, а не пирамиды.</div>
<p class="ans">Ответ: 63</p>`},

{n:5,id:22,html:`
<div class="idea"><b>Идея.</b> «Поразит цель», имея $n$ патронов, — значит попадёт хотя бы один раз. «Хотя бы один» удобнее считать через противоположное событие: промахнулся все $n$ раз.</div>
<ol>
<li>Вероятность промаха при одном выстреле: $1 - 0{,}4 = 0{,}6$.</li>
<li>Вероятность промахнуться $n$ раз подряд: $0{,}6^n$. Тогда вероятность поразить цель: $1 - 0{,}6^n$.</li>
<li>Перебираем $n$, пока не получим не меньше $0{,}7$:
  <br>$n = 1$: $\\;1 - 0{,}6 = 0{,}4$ — мало;
  <br>$n = 2$: $\\;1 - 0{,}36 = 0{,}64$ — мало;
  <br>$n = 3$: $\\;1 - 0{,}216 = 0{,}784 \\geqslant 0{,}7$ — подходит.</li>
</ol>
<div class="trap"><b>Где ошибаются.</b> Складывают вероятности попаданий: $0{,}4 + 0{,}4 = 0{,}8$ — и отвечают «2». Складывать нельзя: попадания в разных выстрелах могут случиться одновременно.</div>
<p class="ans">Ответ: 3</p>`},

{n:7,id:31,html:`
<div class="idea"><b>Идея.</b> Приводим обе части к степени с одним и тем же основанием. Если основания равны, то равны и показатели.</div>
<ol>
<li>Записываем правую часть как степень четвёрки: $64 = 4^3$, значит, $\\dfrac{1}{64} = 4^{-3}$.</li>
<li>Уравнение принимает вид $4^{x-12} = 4^{-3}$. Основания одинаковые — приравниваем показатели: $x - 12 = -3$.</li>
<li>$x = 9$.</li>
<li>Проверка: $4^{9-12} = 4^{-3} = \\dfrac{1}{64}$ — верно.</li>
</ol>
<div class="trap"><b>Где ошибаются.</b> Теряют минус: пишут $\\dfrac{1}{64} = 4^{3}$ и получают $x = 15$. Дробь «единица, делённая на степень» — это всегда отрицательный показатель.</div>
<p class="ans">Ответ: 9</p>`},

{n:9,id:11,html:`
<div class="idea"><b>Идея.</b> Значение производной в точке равно угловому коэффициенту касательной в этой точке. Его находят по двум точкам касательной, попавшим в узлы сетки.</div>
<ol>
<li>На касательной отмечены две точки в узлах сетки: $(-5;\\,7)$ и $(-2;\\,-2)$.</li>
<li>Угловой коэффициент — это изменение $y$, делённое на изменение $x$:
$$k = \\frac{-2 - 7}{-2 - (-5)} = \\frac{-9}{3} = -3.$$</li>
<li>Значит, $f'(x_0) = -3$.</li>
<li>Проверка знаком: касательная идёт вниз слева направо, производная должна быть отрицательной — сходится.</li>
</ol>
<div class="trap"><b>Где ошибаются.</b> Берут для расчёта саму точку касания. Она не попадает в узел сетки, её координаты «на глаз» читаются неточно. Брать нужно только отмеченные точки в узлах.</div>
<p class="ans">Ответ: −3</p>`},

{n:10,id:51,html:`
<div class="idea"><b>Идея.</b> Вода вытекает, пока её уровень выше нуля. Вытекать перестанет в тот момент, когда $H = 0$. Подставляем числа в формулу и решаем квадратное уравнение.</div>
<ol>
<li>Подставляем $H_0 = 0{,}3$, $b = -0{,}25$, $a = 0{,}05$ и приравниваем высоту к нулю:
$$0{,}3 - 0{,}25t + 0{,}05t^2 = 0.$$</li>
<li>Умножаем обе части на $20$, чтобы уйти от десятичных дробей: $t^2 - 5t + 6 = 0$.</li>
<li>Корни: $t = 2$ и $t = 3$.</li>
<li>Бак опустеет в первый из этих моментов, то есть при $t = 2$. После этого воды уже нет, и формула перестаёт описывать происходящее.</li>
</ol>
<div class="trap"><b>Где ошибаются.</b> Выбирают больший корень $t = 3$. Но к этому моменту бак пуст уже целую минуту.</div>
<p class="ans">Ответ: 2</p>`},

{n:11,id:61,html:`
<div class="idea"><b>Идея.</b> Про второй автомобиль известно всё: и скорость, и путь до встречи. Через него находим время, а потом переносим это время на первый.</div>
<ol>
<li>Встреча произошла в $240$ км от $A$. Значит, первый проехал $240$ км, а второй — оставшиеся $450 - 240 = 210$ км.</li>
<li>Второй ехал со скоростью $70$ км/ч: $210 : 70 = 3$ часа.</li>
<li>Первый выехал на час раньше, поэтому был в пути $3 + 1 = 4$ часа.</li>
<li>Скорость первого: $240 : 4 = 60$ км/ч.</li>
</ol>
<div class="trap"><b>Где ошибаются.</b> Забывают про час форы и делят $240$ на $3$ — получают $80$.</div>
<p class="ans">Ответ: 60</p>`},

{n:14,id:1,html:`
<div class="idea"><b>Идея.</b> Формула приведения убирает сдвиг на $\\pi$, а формула двойного угла превращает всё в косинусы одного аргумента. Остаётся вынести общий множитель.</div>
<p><b>а) Решаем уравнение.</b></p>
<ol>
<li>Формула приведения: $\\cos(x + \\pi) = -\\cos x$. Уравнение принимает вид
$$\\cos 2x - \\sqrt2\\cos x + 1 = 0.$$</li>
<li>Формула двойного угла: $\\cos 2x = 2\\cos^2 x - 1$. Подставляем — единицы взаимно уничтожаются:
$$2\\cos^2 x - \\sqrt2\\cos x = 0.$$</li>
<li>Выносим $\\cos x$ за скобку: $\\cos x\\,(2\\cos x - \\sqrt2) = 0$.</li>
<li>Произведение равно нулю, когда равен нулю один из множителей:
  <br>$\\cos x = 0$, откуда $x = \\dfrac{\\pi}{2} + \\pi n$;
  <br>$\\cos x = \\dfrac{\\sqrt2}{2}$, откуда $x = \\pm\\dfrac{\\pi}{4} + 2\\pi n$, $\\;n \\in \\mathbb{Z}$.</li>
</ol>
<p><b>б) Отбираем корни на отрезке $\\left[-4\\pi;\\ -\\dfrac{5\\pi}{2}\\right]$.</b> Для каждой серии решаем двойное неравенство относительно $n$ (сразу делим на $\\pi$).</p>
<ol>
<li>Серия $\\dfrac{\\pi}{2} + \\pi n$: $\\;-4 \\leqslant \\dfrac12 + n \\leqslant -\\dfrac52$, то есть $-4{,}5 \\leqslant n \\leqslant -3$. Подходят $n = -4$ и $n = -3$: корни $-\\dfrac{7\\pi}{2}$ и $-\\dfrac{5\\pi}{2}$.</li>
<li>Серия $\\dfrac{\\pi}{4} + 2\\pi n$: $\\;-4 \\leqslant \\dfrac14 + 2n \\leqslant -\\dfrac52$, то есть $-\\dfrac{17}{8} \\leqslant n \\leqslant -\\dfrac{11}{8}$. Подходит $n = -2$: корень $-\\dfrac{15\\pi}{4}$.</li>
<li>Серия $-\\dfrac{\\pi}{4} + 2\\pi n$: $\\;-4 \\leqslant -\\dfrac14 + 2n \\leqslant -\\dfrac52$, то есть $-\\dfrac{15}{8} \\leqslant n \\leqslant -\\dfrac{9}{8}$. Целых $n$ здесь нет.</li>
</ol>
<div class="trap"><b>Где ошибаются.</b> На шаге 3 делят обе части на $\\cos x$ вместо вынесения за скобку — и теряют целую серию $\\dfrac{\\pi}{2} + \\pi n$. И ещё: $-\\dfrac{5\\pi}{2}$ — это конец отрезка, скобка квадратная, корень входит.</div>
<p class="ans">Ответ: а) $\\dfrac{\\pi}{2} + \\pi n$, $\\;\\pm\\dfrac{\\pi}{4} + 2\\pi n$, $\\;n \\in \\mathbb{Z}$; &nbsp; б) $-\\dfrac{15\\pi}{4}$, $-\\dfrac{7\\pi}{2}$, $-\\dfrac{5\\pi}{2}$</p>`}
];

const TITLES={1:'Планиметрия',3:'Стереометрия',5:'Вероятность (сложная)',7:'Уравнения',9:'Производная и её график',
  10:'Задача с формулой',11:'Текстовые задачи',14:'Уравнения, вторая часть'};
const load=src=>new Promise(res=>{const s=document.createElement('script');s.src=src;s.onload=s.onerror=res;document.head.appendChild(s);});

/* What the student sees today. Solutions exist only for the first task of a
   prototype (art with two parts, e.g. "1.7"); others are sent to "Похожие задачи". */
function nowBlock(n,id){
  if(n>=14) return `<p>Разбора нет. Ученик видит только ответ и сам сравнивает со своим.</p>`;
  const T=window.TASKDATA[n],S=(window.SOLDATA||{})[n]||{};
  if(S[id]) return `<div class="old">${S[id]}</div>`;
  let p=id;while(p>1&&T[p-1].art.split('.').length>2)p--;
  return `<p>«Разбора именно к этим числам нет, но задача того же типа разобрана — открой „Похожие задачи“».</p>`+
    (S[p]?`<details><summary>Разбор соседней задачи ${T[p-1].art} с другими числами — его ученик найдёт в «Похожих»</summary><div class="old">${S[p]}</div></details>`:'');
}

(async()=>{
  const ns=[...new Set(PILOT.map(p=>p.n))];
  await Promise.all(ns.flatMap(n=>[load(`img/t${n}/data.js`),n<14?load(`img/t${n}/sol.js`):null]));
  const list=document.getElementById('list');
  list.innerHTML=PILOT.map(p=>{const t=window.TASKDATA[p.n][p.id-1];
    return `<section class="task">
      <h2>№${p.n} · ${TITLES[p.n]} · задача ${t.art}</h2>
      <div class="cond">${t.c}</div>
      <div class="now"><div class="label">Сейчас в тренажёре</div>${nowBlock(p.n,p.id)}</div>
      <div class="new"><div class="label">Новый разбор</div>${p.html}</div>
    </section>`;}).join('');
  const go=()=>window.renderMathInElement?renderMathInElement(list,{delimiters:[
    {left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],throwOnError:false}):setTimeout(go,50);
  go();
})();
</script>
</body>
</html>
