<html lang="ru">

<meta name="twitter:image" content="https://kirillnyunenkov.github.io/math/preview.png">

<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Тренажёр ЕГЭ">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@500;600;700&family=Golos+Text:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="katex/katex.min.css">
<style>
  :root{
    --bg:#f4f1ea;--paper:#fbfaf6;--ink:#1f2421;--muted:#6b6f6a;--line:#e0dccf;
    --green:#2f8f5b;--green-soft:#e3f1e8;--dark:#2a2d2a;--accent:#b5532a;
    --orange:#d9822b;--orange-soft:#f6ecdd;--red:#c0392b;--red-soft:#fbe9e7;
    --shadow:0 1px 2px rgba(31,36,33,.06),0 8px 24px rgba(31,36,33,.06);
    --header-bg:rgba(244,241,234,.92);--vbar-bg:rgba(251,250,246,.95);
    --input-bg:#fff;--bar-empty:#eceadf;--soft-bg:#f7ece6;--soft-border:#e8d2c6;
    --warn-border:#ecd3ad;--warn-text:#7a4b16;--warn-strong:#5c380f;
    --feature-1:#2f3b34;--feature-2:#1f2421;--feature-ink:#f4f1ea;--feature-border:transparent;
    --feature-tile:rgba(255,255,255,.08);--feature-btn:rgba(255,255,255,.12);--feature-btn-h:rgba(255,255,255,.22);
    --dot-empty:#fff;--img-filter:none;--on-dark:#fff;
    --sk-base:#e8e4da;--sk-shine:#f5f3ed;
  }
  html[data-theme="dark"]{
    --bg:#181a17;--paper:#222420;--ink:#ece7db;--muted:#9b9e95;--line:#363a31;
    --green:#4fb37e;--green-soft:rgba(79,179,126,.16);--dark:#cfcabb;--accent:#d6794a;
    --orange:#e0913f;--orange-soft:rgba(224,145,63,.14);--red:#e26a5b;--red-soft:rgba(226,106,91,.16);
    --shadow:0 1px 2px rgba(0,0,0,.45),0 10px 28px rgba(0,0,0,.4);
    --header-bg:rgba(24,26,23,.92);--vbar-bg:rgba(31,34,30,.95);
    --input-bg:#1d201c;--bar-empty:#2d312a;--soft-bg:rgba(214,121,74,.15);--soft-border:rgba(214,121,74,.4);
    --warn-border:rgba(224,145,63,.4);--warn-text:#e8c79a;--warn-strong:#f3dcb7;
    --feature-1:#2c332c;--feature-2:#222a23;--feature-ink:#ece7db;--feature-border:#3a3f36;
    --feature-tile:rgba(255,255,255,.06);--feature-btn:rgba(255,255,255,.1);--feature-btn-h:rgba(255,255,255,.2);
    --dot-empty:var(--paper);--img-filter:invert(.92) hue-rotate(180deg);--on-dark:#20231d;
    --sk-base:#2e3229;--sk-shine:#3c4237;
  }
  *{box-sizing:border-box;} html{scroll-behavior:smooth;}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:'Golos Text',system-ui,sans-serif;line-height:1.55;-webkit-font-smoothing:antialiased;}
  header{position:sticky;top:0;z-index:50;background:var(--header-bg);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);}
  .head-inner{max-width:1180px;margin:0 auto;padding:14px 24px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;position:relative;}
  .title{font-family:'Lora',serif;font-weight:700;font-size:20px;letter-spacing:-.01em;margin:0;white-space:nowrap;cursor:pointer;}
  .title span{color:var(--accent);}
  .title .by{color:var(--muted);font-weight:500;font-size:.72em;opacity:.6;letter-spacing:0;}
  .back{font:inherit;font-size:12.5px;color:var(--muted);background:none;border:1px solid var(--line);border-radius:8px;padding:5px 11px;cursor:pointer;transition:.15s;display:none;}
  .back:hover{color:var(--accent);border-color:var(--accent);}
  .task-back{display:block;margin-bottom:14px;}
  .install-mobile-only{display:none!important;}
  @media(max-width:760px){.install-mobile-only{display:inline-flex!important;}}
  .stats{display:flex;gap:16px;margin-left:auto;flex-wrap:wrap;}
  .stat{display:flex;align-items:center;gap:6px;font-size:13.5px;color:var(--muted);}
  .dot{width:11px;height:11px;border-radius:3px;display:inline-block;}
  .dot.g{background:var(--green);}.dot.o{background:var(--orange);}.dot.b{background:var(--dark);}.dot.n{background:var(--dot-empty);border:1px solid var(--line);}
  .stat b{color:var(--ink);font-weight:600;}
  .ghost{font:inherit;font-size:12.5px;color:var(--muted);background:none;border:1px solid var(--line);border-radius:8px;padding:5px 11px;cursor:pointer;transition:.15s;}
  .ghost:hover{border-color:var(--accent);color:var(--accent);}
  #theme{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:6px 9px;}
  #theme .ic-sun{display:none;} html[data-theme="dark"] #theme .ic-moon{display:none;}
  html[data-theme="dark"] #theme .ic-sun{display:inline;}
  .nav-only{display:none;}
  .burger{display:none;font:inherit;background:none;border:1px solid var(--line);border-radius:8px;padding:0;cursor:pointer;width:36px;height:36px;flex-direction:column;align-items:center;justify-content:center;gap:4px;transition:border-color .15s;flex:none;}
  .burger:hover{border-color:var(--accent);}
  .burger span{display:block;width:16px;height:2px;background:var(--ink);border-radius:2px;}
  .nav-menu{display:contents;}

  .hub{max-width:1180px;margin:0 auto;padding:32px 24px 80px;}
  .hub h2{font-family:'Lora',serif;font-weight:600;font-size:26px;margin:0 0 6px;}
  .hub .sub{color:var(--muted);margin:0 0 28px;font-size:15px;}
  .tasks{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;}
  .tcard{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:18px 20px;box-shadow:var(--shadow);
    cursor:pointer;transition:transform .12s,border-color .15s;display:flex;flex-direction:column;gap:12px;text-align:left;font:inherit;color:var(--ink);}
  .tcard:hover{transform:translateY(-2px);border-color:var(--accent);}
  .tcard:disabled{opacity:.55;cursor:default;}
  .tcard:disabled:hover{transform:none;border-color:var(--line);}
  .tcard .tnum{font-family:'Lora',serif;font-weight:700;color:var(--accent);font-size:15px;}
  .tcard .tname{font-size:16px;font-weight:500;line-height:1.3;flex:1;}
  .bar{height:7px;border-radius:99px;background:var(--bar-empty);overflow:hidden;display:flex;}
  .bar .bg{background:var(--green);}.bar .bo{background:var(--orange);}.bar .bb{background:var(--dark);}
  .tmeta{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);}

  .title a.by{text-decoration:none;cursor:pointer;}
  .title a.by:hover{color:var(--accent);opacity:1;text-decoration:underline;}
  .hub-foot{margin-top:40px;}
  .hf-card{display:flex;align-items:center;gap:18px;flex-wrap:wrap;background:var(--paper);border:1px solid var(--line);
    border-radius:14px;padding:20px 24px;box-shadow:var(--shadow);}
  .hf-title{font-family:'Lora',serif;font-weight:600;font-size:17px;margin-bottom:4px;}
  .hf-sub{color:var(--muted);font-size:14px;line-height:1.5;max-width:520px;}
  .hf-text{flex:1;min-width:220px;}
  .hf-btn{margin-left:auto;white-space:nowrap;text-decoration:none;background:var(--accent);color:#fff;font-weight:600;
    font-size:14.5px;padding:11px 20px;border-radius:10px;transition:filter .15s;align-self:center;}
  .hf-btn:hover{filter:brightness(1.08);}

  /* инструкция */
  .help{max-width:720px;margin:0 auto;padding:30px 24px 80px;}
  .help h2{font-family:'Lora',serif;font-weight:600;font-size:30px;margin-bottom:6px;}
  .help .help-lead{color:var(--muted);font-size:15px;margin-bottom:26px;}
  .help-step{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:22px 24px;
    box-shadow:var(--shadow);margin-bottom:16px;border-left:4px solid var(--accent);}
  .help-step h3{font-family:'Lora',serif;font-weight:600;font-size:20px;margin-bottom:10px;display:flex;gap:10px;align-items:baseline;}
  .help-step h3 .nm{color:var(--accent);font-weight:700;}
  .help-step p{font-size:15.5px;line-height:1.6;margin-bottom:10px;}
  .help-step p:last-child{margin-bottom:0;}
  .help-legend{list-style:none;display:flex;flex-direction:column;gap:8px;margin:12px 0;}
  .help-legend li{display:flex;align-items:center;gap:10px;font-size:15px;}
  .help-legend .dot{width:13px;height:13px;border-radius:50%;flex:none;}
  .help-legend b{font-weight:600;}
  .help-way{background:var(--bg);border-radius:10px;padding:12px 15px;margin-bottom:10px;font-size:15px;line-height:1.55;}
  .help-way b{color:var(--ink);}
  .help-cta{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:24px;padding-top:22px;border-top:1px solid var(--line);}
  .help-cta span{color:var(--muted);font-size:15px;}

  /* установка как приложение */
  .install-bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--paper);
    border:1px solid var(--soft-border);border-left:4px solid var(--accent);border-radius:12px;
    padding:12px 16px;margin-bottom:22px;box-shadow:var(--shadow);}
  .install-bar .ib-text{flex:1;min-width:180px;font-size:14px;line-height:1.45;}
  .ib-go{font:inherit;font-size:14px;font-weight:600;background:var(--accent);color:#fff;border:none;
    border-radius:9px;padding:9px 18px;cursor:pointer;white-space:nowrap;}
  .ib-go:hover{filter:brightness(1.08);}
  .install-bar .ib-x{font:inherit;font-size:16px;line-height:1;color:var(--muted);background:none;border:none;cursor:pointer;padding:4px 6px;}
  .install-bar .ib-x:hover{color:var(--accent);}
  .install-steps{font-size:15px;line-height:1.6;}
  .install-steps b{font-weight:600;}
  .install-steps .ok{color:var(--green);font-weight:600;}
  .install-list{list-style:none;display:flex;flex-direction:column;gap:11px;margin:14px 0 0;padding:0;}
  .install-list li{font-size:14.5px;line-height:1.55;}
  .install-list b{font-weight:600;}
  .ios-hint-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:9999;display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s;}
  .ios-hint-overlay.open{opacity:1;pointer-events:auto;}
  .ios-hint-sheet{background:var(--paper);border-radius:20px 20px 0 0;padding:24px 20px max(40px,env(safe-area-inset-bottom));width:100%;max-width:520px;transform:translateY(80px);transition:transform .25s cubic-bezier(.4,0,.2,1);box-shadow:0 -4px 32px rgba(0,0,0,.15);}
  .ios-hint-overlay.open .ios-hint-sheet{transform:translateY(0);}
  .ios-hint-sheet h3{font-family:'Lora',serif;font-size:18px;margin:0 0 10px;font-weight:600;}
  .ios-hint-sheet .ih-sub{font-size:13.5px;color:var(--muted);margin:0 0 16px;}
  .ios-hint-sheet ol{margin:0 0 20px;padding-left:22px;display:flex;flex-direction:column;gap:9px;}
  .ios-hint-sheet ol li{font-size:14.5px;line-height:1.55;}
  .ios-hint-sheet ol li b{font-weight:600;}
  .ios-hint-sheet .ih-icon{font-style:normal;display:inline-block;background:var(--line);border-radius:6px;padding:1px 6px;font-size:13px;font-weight:600;letter-spacing:.01em;}
  .ios-hint-close{width:100%;font:inherit;font-size:15px;font-weight:600;background:var(--accent);color:#fff;border:none;border-radius:12px;padding:13px;cursor:pointer;transition:opacity .15s;}
  .ios-hint-close:hover{opacity:.88;}

  /* прототипы и похожие задачи */
  .proto-num{font-family:'Lora',serif;font-weight:700;font-size:16px;color:var(--accent);}
  .card-top .proto-num{font-size:16px;}
  .similar{margin-top:16px;border-top:1px dashed var(--line);padding-top:14px;}
  .similar-toggle{color:var(--accent);border-color:var(--soft-border);}
  .similar-toggle:hover{background:var(--soft-bg);}
  .similar-body{display:none;margin-top:14px;flex-direction:column;gap:14px;}
  .similar-body.open{display:flex;}
  .subcard{background:var(--bg);border:1px solid var(--line);border-radius:11px;padding:16px 18px;}
  .sub-num{font-size:12.5px;font-weight:600;color:var(--muted);margin-bottom:10px;}
  .cap{font-size:12px;font-weight:600;color:var(--muted);margin-bottom:8px;text-transform:uppercase;letter-spacing:.03em;}
  .figwrap{margin:16px 0 4px;text-align:center;}
  .block{display:flex;flex-direction:column;gap:18px;}
  .block + .block{margin-top:18px;}
  .block-head{font-family:'Lora',serif;font-size:25px;font-weight:700;color:var(--ink);
    line-height:1.15;margin:6px 2px 0;padding-bottom:11px;border-bottom:2.5px solid var(--accent);}
  .tex .katex{font-size:1.06em;}
  .tex .katex-display{margin:.5em 0;}

  .wrap{max-width:1180px;margin:0 auto;padding:28px 24px 80px;display:grid;grid-template-columns:168px 1fr;gap:36px;align-items:start;}
  .grid-panel{position:sticky;top:16px;}
  .grid-label{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:10px;}
  .grid{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;}
  .cell{aspect-ratio:1;border:1px solid var(--line);border-radius:6px;background:var(--paper);color:var(--muted);font-size:12px;
    font-weight:500;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform .1s,background .15s,color .15s;font-family:'Golos Text',sans-serif;}
  .cell:hover{transform:scale(1.12);border-color:var(--ink);}
  .cell.g{background:var(--green);border-color:var(--green);color:#fff;}
  .cell.o{background:var(--orange);border-color:var(--orange);color:#fff;}
  .cell.b{background:var(--dark);border-color:var(--dark);color:var(--on-dark);}
  .list{display:flex;flex-direction:column;gap:18px;min-width:0;}
  .grid-panel{min-width:0;}
  .tex{overflow-wrap:break-word;}
  .card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:20px 22px;box-shadow:var(--shadow);
    scroll-margin-top:78px;border-left:4px solid var(--line);transition:border-color .2s;
    content-visibility:auto;contain-intrinsic-size:auto 360px;}
  .card.is-g{border-left-color:var(--green);}.card.is-o{border-left-color:var(--orange);}.card.is-b{border-left-color:var(--dark);}
  .card-top{display:flex;align-items:baseline;gap:12px;margin-bottom:12px;}
  .num{font-family:'Lora',serif;font-weight:700;font-size:22px;color:var(--accent);line-height:1;}
  .cond img,.sol-body img{max-width:760px;width:100%;height:auto;display:block;border-radius:6px;}
  .actions{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap;}
  .btn{font:inherit;font-size:13.5px;font-weight:500;cursor:pointer;border-radius:9px;padding:8px 14px;border:1px solid var(--line);background:var(--paper);color:var(--ink);transition:.15s;}
  .btn:hover{border-color:var(--ink);}
  .btn.mk-g.on{background:var(--green);border-color:var(--green);color:#fff;}
  .btn.mk-o.on{background:var(--orange);border-color:var(--orange);color:#fff;}
  .btn.mk-b.on{background:var(--dark);border-color:var(--dark);color:var(--on-dark);}
  .answer-check{display:flex;align-items:center;gap:8px;margin-top:14px;flex-wrap:wrap;}
  .ans-input{font:inherit;font-size:14px;padding:8px 12px;border:1px solid var(--line);border-radius:9px;
    background:var(--paper);color:var(--ink);width:170px;outline:none;transition:.15s;}
  .ans-input:focus{border-color:var(--accent);}
  .ans-input.correct{border-color:var(--green);background:var(--green-soft);color:var(--green);font-weight:600;}
  .ans-input.wrong{border-color:var(--red);background:var(--red-soft);color:var(--red);font-weight:600;}
  .btn.check{color:var(--accent);border-color:var(--soft-border);}
  .btn.check:hover{background:var(--soft-bg);}
  .ans-msg{font-size:13.5px;font-weight:600;}
  .ans-msg.ok{color:var(--green);}
  .ans-msg.no{color:var(--red);}
  @keyframes ans-shake{0%,100%{transform:translateX(0)}15%{transform:translateX(-6px)}30%{transform:translateX(6px)}45%{transform:translateX(-4px)}60%{transform:translateX(4px)}80%{transform:translateX(-2px)}}
  @keyframes ans-pop{0%{transform:scale(1)}40%{transform:scale(1.07)}100%{transform:scale(1)}}
  @keyframes ans-flash{0%{opacity:0;transform:translateY(3px)}100%{opacity:1;transform:translateY(0)}}
  .ans-input.shake{animation:ans-shake .42s;}
  .ans-input.pop{animation:ans-pop .35s;}
  .ans-msg.flash{animation:ans-flash .28s;}

  /* фильтры по статусу */
  .filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px;}
  .chip{font:inherit;font-size:13px;font-weight:500;cursor:pointer;border-radius:99px;padding:6px 14px;
    border:1px solid var(--line);background:var(--paper);color:var(--muted);transition:.15s;}
  .chip:hover{border-color:var(--ink);color:var(--ink);}
  .chip.on{background:var(--ink);border-color:var(--ink);color:var(--bg);}
  .filters-empty{color:var(--muted);font-size:14px;padding:8px 2px;}

  /* кнопка-баннер «Собрать вариант» */
  .variant-cta{display:flex;align-items:center;gap:16px;width:100%;text-align:left;font:inherit;cursor:pointer;
    background:linear-gradient(135deg,var(--feature-1),var(--feature-2));color:var(--feature-ink);border:1px solid var(--feature-border);border-radius:14px;
    padding:18px 22px;margin-bottom:22px;box-shadow:var(--shadow);transition:transform .12s;}
  .variant-cta:hover{transform:translateY(-2px);}
  .variant-cta .vc-ico{font-size:26px;line-height:1;}
  .variant-cta .vc-t{display:block;font-family:'Lora',serif;font-weight:600;font-size:17px;margin:0 0 3px;}
  .variant-cta .vc-s{display:block;font-size:13px;opacity:.8;line-height:1.4;}
  .variant-cta .vc-go{margin-left:auto;font-size:13px;opacity:.85;white-space:nowrap;}

  /* экран варианта */
  .vbox{max-width:820px;margin:0 auto;padding:28px 24px 80px;}
  .vintro{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:26px;box-shadow:var(--shadow);}
  .vintro h2{font-family:'Lora',serif;font-weight:600;font-size:24px;margin:0 0 8px;}
  .vintro .lead{color:var(--muted);margin:0 0 18px;}
  .vwarn{display:flex;gap:10px;background:var(--orange-soft);border:1px solid var(--warn-border);border-radius:11px;
    padding:13px 15px;font-size:14px;color:var(--warn-text);margin-bottom:20px;line-height:1.5;}
  .vwarn b{color:var(--warn-strong);}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-size:14.5px;padding:11px 22px;}
  .btn.primary:hover{filter:brightness(1.07);border-color:var(--accent);}
  .vbar{position:sticky;top:62px;z-index:20;display:flex;align-items:center;gap:14px;flex-wrap:wrap;
    background:var(--vbar-bg);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:12px;
    padding:12px 16px;margin-bottom:20px;box-shadow:var(--shadow);}
  .vtimer{font-family:'Lora',serif;font-weight:700;font-size:20px;color:var(--ink);font-variant-numeric:tabular-nums;}
  .vbar .vprog{font-size:13px;color:var(--muted);}
  .vbar .spacer{margin-left:auto;}
  .vcard{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:20px 22px;
    box-shadow:var(--shadow);margin-bottom:16px;border-left:4px solid var(--line);}
  .vcard.r-ok{border-left-color:var(--green);}

const HIST_KEY='ege_variants_v1';

// компактная упаковка истории в ссылку (отдельный параметр &h=)
function packBits(list){const by=[];let cur=0,fill=0;
  for(const[v,n]of list){for(let i=n-1;i>=0;i--){cur=(cur<<1)|((v>>i)&1);if(++fill===8){by.push(cur);cur=0;fill=0;}}}
  if(fill>0)by.push(cur<<(8-fill));return by;}
function bytesToB64(by){return btoa(String.fromCharCode(...by)).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');}
function b64ToBytes(str){let b=str.replace(/-/g,'+').replace(/_/g,'/');while(b.length%4)b+='=';return Array.from(atob(b),c=>c.charCodeAt(0));}
function histEncode(){
  const h=loadHistory();if(!h.length)return'';
  const s=h.slice().sort((a,b)=>a.t-b.t),base=Math.floor(s[0].t/60000),L=[];
  L.push([1,8]);L.push([Math.min(s.length,255),8]);L.push([base,32]);
  s.slice(0,255).forEach(r=>{
    const dm=Math.min(Math.max(Math.floor(r.t/60000)-base,0),1048575);
    L.push([dm,20]);L.push([Math.min(r.p|0,15),4]);L.push([Math.min(r.total|0,31),5]);
    L.push([Math.min(Math.round(r.ms/1000),16383),14]);
  });
  return bytesToB64(packBits(L));
}
function histDecode(str){
  try{const by=b64ToBytes(str);let idx=0,bit=0;
    const read=n=>{let v=0;for(let k=0;k<n;k++){v=(v<<1)|((by[idx]>>(7-bit))&1);if(++bit===8){bit=0;idx++;}}return v;};
    if(read(8)!==1)return null;const count=read(8),base=read(32),out=[];
    for(let i=0;i<count;i++){const dm=read(20),p=read(4),tot=read(5),sec=read(14);
      out.push({t:(base+dm)*60000,p,total:tot,s:secondaryScore(p),ms:sec*1000});}
    return out;}catch(e){return null;}
}

  const key=r=>Math.floor(r.t/60000)+':'+r.p+':'+r.total,map={};
  loadHistory().concat(incoming).forEach(r=>{map[key(r)]=r;});

  if(arr.length>50)arr=arr.slice(arr.length-50);

}

  const xy=vals.map((v,i)=>{const x=6+i*(w-12)/(vals.length-1);const y=h-6-((v-min)/span)*(h-16);return[x,y];});
  const line=xy.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
  const dots=xy.map(p=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="2.4" fill="var(--accent)"/>`).join('');
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">

}

const STATE_VER=2;
// Самоописываемый формат: версия + для каждого задания с отметками его номер,
// максимальный отмеченный id и статусы 1..maxId. Не зависит от текущего TASKS,
// поэтому смена count / порядка / добавление заданий не ломает старые ссылки.
function encodeState(){
  const L=[],blocks=[];
  Object.keys(state).forEach(k=>{const n=+k,ts=state[k]||{};
    const ids=Object.keys(ts).map(Number).filter(id=>ts[id]);
    if(ids.length)blocks.push({n,maxId:Math.max(...ids),ts});});
  L.push([STATE_VER,8]);L.push([blocks.length,8]);
  blocks.forEach(b=>{L.push([b.n,8]);L.push([b.maxId,16]);
    for(let id=1;id<=b.maxId;id++){const s=b.ts[id];L.push([s==='g'?1:s==='b'?2:s==='o'?3:0,2]);}});
  return bytesToB64(packBits(L));
}
function decodeState(str){
  try{const by=b64ToBytes(str);let idx=0,bit=0;
    const read=n=>{let v=0;for(let k=0;k<n;k++){v=(v<<1)|((by[idx]>>(7-bit))&1);if(++bit===8){bit=0;idx++;}}return v;};
    if(read(8)!==STATE_VER)return null;          // другая версия формата — отвергаем явно
    const tc=read(8);if(tc>40)return null;
    const res={};
    for(let i=0;i<tc;i++){const n=read(8),maxId=read(16);
      if(n<1||n>40||maxId<1||maxId>2000)return null;
      res[n]=res[n]||{};
      for(let id=1;id<=maxId;id++){const v=read(2);
        if(v===1)res[n][id]='g';else if(v===2)res[n][id]='b';else if(v===3)res[n][id]='o';}}
    if(idx>by.length)return null;                // строка обрезана — не доверяем
    return res;
  }catch(e){return null;}
}

      :`<div class="solution" id="sol-${id}"><div class="sol-body"><img loading="lazy" data-src="${SOL(n,id)}" alt="Решение ${id}"></div></div>`;
  const pl=protoList(n);
  const acHTML=id=>{const ansTxt=task.mode==='html'?plainAnswer((data[id-1]||{}).a):'';
    return ansTxt?`<div class="answer-check">
          <input class="ans-input" type="text" inputmode="decimal" placeholder="Ваш ответ" data-id="${id}" autocomplete="off">
          <button class="btn check" data-check="${id}">Проверить</button>
          <span class="ans-msg"></span>
        </div>`:'';};
  const repCard=(id,protoNum,simIds)=>{const st=ts[id],c=st==='g'?'is-g':st==='o'?'is-o':st==='b'?'is-b':'';
    const label=protoNum!=null?`<span class="num proto-num">Прототип ${protoNum}</span>`:`<span class="num">${id}</span>`;
    const sim=(simIds&&simIds.length)?`<div class="similar">
          <button class="btn similar-toggle" data-similar="${id}" data-sim-ids="${simIds.join(',')}" data-sim-n="${simIds.length}">Похожие задачи (${simIds.length})</button>
          <div class="similar-body" id="sim-${id}"></div></div>`:'';
    return `<article class="card ${c}" id="task-${id}">
        <div class="card-top">${label}</div>
        ${condHTML(id)}
        ${acHTML(id)}
        <div class="actions">
          <button class="btn mk-g ${st==='g'?'on':''}" data-mark="g" data-id="${id}">✓ Умею решать</button>
          <button class="btn mk-o ${st==='o'?'on':''}" data-mark="o" data-id="${id}">↻ Надо повторить</button>
          <button class="btn mk-b ${st==='b'?'on':''}" data-mark="b" data-id="${id}">✗ Надо разобраться</button>
          <button class="btn sol" data-sol="${id}">Показать решение</button>
        </div>
        ${solBox(id)}
        ${sim}
      </article>`;};
  const gridCells=pl
    ?pl.map(grp=>{const id=grp.ids[0],st=ts[id],c=st==='g'?'g':st==='o'?'o':st==='b'?'b':'';
        return `<button class="cell ${c}" data-cell="${id}" title="Прототип ${grp.p}">${grp.p}</button>`;}).join('')
    :Array.from({length:task.count},(_,i)=>{const id=i+1,st=ts[id],c=st==='g'?'g':st==='o'?'o':st==='b'?'b':'';
        return `<button class="cell ${c}" data-cell="${id}">${id}</button>`;}).join('');
  let listBody;
  if(pl){
    const subOf=rep=>((data[rep-1]||{}).sub)||'';
    const distinct=new Set(pl.map(g=>subOf(g.ids[0])).filter(Boolean));
    const showHeads=distinct.size>1;
    if(showHeads){
      let html='',cur=null,buf='';
      const flush=()=>{if(buf!==''){html+=`<section class="block"><h3 class="block-head">${cur}</h3>${buf}</section>`;buf='';}};
      pl.forEach(grp=>{const s=subOf(grp.ids[0])||cur||'';
        if(s!==cur){flush();cur=s;}
        buf+=repCard(grp.ids[0],grp.p,grp.ids.slice(1));});
      flush();
      listBody=html;
    } else {
      listBody=pl.map(grp=>repCard(grp.ids[0],grp.p,grp.ids.slice(1))).join('');
    }
  } else {
    listBody=Array.from({length:task.count},(_,i)=>repCard(i+1,null,null)).join('');
  }
  const gridLabel=pl?`Задание ${n} · ${pl.length} прототипов`:`Задание ${n}`;
  const fullHTML=`<div class="wrap" data-n="${n}">
    <aside class="grid-panel"><button class="back task-back" data-home>← К списку заданий</button><div class="grid-label">${gridLabel}</div>

        <button class="chip" data-filter="none">Не решал</button>
      </div>
      <div class="filters-empty" id="filter-empty" style="display:none">В этой категории пока пусто.</div>
      ${listBody}</main></div>`;
  appEl.innerHTML=skHTML;
  const tmp=document.createElement('div');
  tmp.style.cssText='position:fixed;top:-9999px;left:0;width:1px;height:1px;overflow:hidden;';
  tmp.innerHTML=fullHTML;
  document.body.appendChild(tmp);
  const pending=[...tmp.querySelectorAll('img')].filter(i=>!i.complete);
  const showReal=()=>{
    tmp.remove();
    if(parseRoute().n!==n)return;
    statsEl.innerHTML=taskStatsHTML(n);
    appEl.innerHTML=fullHTML;
    typeset(appEl.querySelector('.list'));
  };
  if(!pending.length){showReal();}
  else{Promise.all(pending.map(img=>new Promise(r=>{img.addEventListener('load',r,{once:true});img.addEventListener('error',r,{once:true});})))
    .then(showReal);}
}

// --- конструктор варианта: ученик сам выбирает задания, количество и режим ---
const BUILDER_KEY='ege_builder_v1';
const EXAM_HINT='Таймер, ввод ответов, в конце — первичный и тестовый балл. Ответы влияют на прогресс.';
const TRAIN_HINT='Без таймера: решаешь и сразу проверяешь каждую задачу, отмечаешь статус. Прогресс сохраняется.';
function activeTasks(){return TASKS.filter(t=>!t.hidden&&t.count>0);}
function maxForTask(n){return displayCount(n);}                 // потолок = число прототипов (данные не нужны)
function defaultBuilder(){const counts={};activeTasks().forEach(t=>counts[t.n]=Math.min(1,maxForTask(t.n)));return{counts,mode:'exam'};}
let builder=null;
function loadBuilder(){
  let b=null;try{b=JSON.parse(localStorage.getItem(BUILDER_KEY));}catch(e){}
  const d=defaultBuilder();
  if(b&&b.counts){activeTasks().forEach(t=>{const v=b.counts[t.n];
    if(typeof v==='number')d.counts[t.n]=Math.max(0,Math.min(v,maxForTask(t.n)));});
    if(b.mode==='exam'||b.mode==='train')d.mode=b.mode;}
  return d;
}
function saveBuilder(){try{localStorage.setItem(BUILDER_KEY,JSON.stringify(builder));}catch(e){}}
function builderTotal(){return activeTasks().reduce((s,t)=>s+(builder.counts[t.n]||0),0);}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function bumpBuilder(n,delta){
  const mx=maxForTask(n),q=Math.max(0,Math.min((builder.counts[n]||0)+delta,mx));
  builder.counts[n]=q;saveBuilder();
  const qEl=document.getElementById('q-'+n);if(qEl)qEl.textContent=q;
  const dec=document.querySelector('[data-dec="'+n+'"]');if(dec)dec.disabled=q<=0;
  const inc=document.querySelector('[data-inc="'+n+'"]');if(inc)inc.disabled=q>=mx;
  syncBuilderTotal();
}
function syncBuilderTotal(){const t=builderTotal();
  const el=document.getElementById('cfg-total');if(el)el.textContent=t;
  const b=document.querySelector('[data-build]');if(b)b.disabled=!t;}
function applyPreset(p){
  activeTasks().forEach(t=>{const mx=maxForTask(t.n);
    builder.counts[t.n]=p==='each1'?Math.min(1,mx):p==='max'?mx:0;});
  saveBuilder();renderBuilder();
}
function setBuilderMode(m){builder.mode=m;saveBuilder();
  document.querySelectorAll('.mode-seg .seg').forEach(s=>s.classList.toggle('on',s.dataset.mode===m));
  const h=document.getElementById('mode-hint');if(h)h.textContent=m==='exam'?EXAM_HINT:TRAIN_HINT;}
function buildVariant(){
  if(!builder)builder=loadBuilder();
  const sel=activeTasks().filter(t=>(builder.counts[t.n]||0)>0).map(t=>t.n);
  if(!sel.length)return;
  const mode=builder.mode;
  appEl.innerHTML='<div class="vbox"><p style="color:var(--muted)">Собираю вариант…</p></div>';
  ensureAll(sel,()=>{
    const items=[];
    sel.forEach(n=>{if(!Array.isArray(window.TASKDATA[n]))return;
      const want=builder.counts[n],pl=protoList(n);
      let ids;
      if(pl&&pl.length){                                              // выбираем разные прототипы, по случайному экземпляру каждого
        ids=shuffle(pl.slice()).slice(0,Math.min(want,pl.length))
          .map(grp=>grp.ids[Math.floor(Math.random()*grp.ids.length)]);
      }else{                                                          // нет прототипов — разные задачи подряд
        ids=shuffle(Array.from({length:taskCfg(n).count},(_,i)=>i+1)).slice(0,Math.min(want,taskCfg(n).count));
      }
      ids.forEach(id=>items.push({n,id}));});
    if(!items.length)return;
    variant={items,mode,started:true,finished:false,startAt:Date.now(),elapsed:0};
    renderVariant();
  });
}
function finishVariant(){
  variant.elapsed=Date.now()-variant.startAt;
  let correct=0;
  variant.items.forEach((it,i)=>{
    const inp=document.querySelector('.v-input[data-vi="'+i+'"]');
    const given=inp?inp.value.trim():'';it.given=given;
    const d=(window.TASKDATA[it.n]||[])[it.id-1]||{};
    const ok = given!=='' && answersEqual(given, plainAnswer(d.a));it.ok=ok;if(ok)correct++;
    const cur=(state[it.n]||{})[it.id];
    recordStatus(it.n,it.id, ok ? ((cur==='b'||cur==='o')?'o':'g') : 'b');
  });
  save();variant.finished=true;
  pushHistory({t:Date.now(),p:correct,s:secondaryScore(correct),ms:variant.elapsed,total:variant.items.length});
  if(variantTimerId){clearInterval(variantTimerId);variantTimerId=null;}
  renderVariant();
}

appEl.addEventListener('click',e=>{
  const inst=e.target.closest('[data-install]'); if(inst){doInstall();return;}
  const dv=e.target.closest('[data-variant]');
  if(dv){variant=null;if(/#\/v\b/.test(location.hash))renderVariant();else go('#/v');return;}
  // --- конструктор ---
  const md=e.target.closest('[data-mode]'); if(md){setBuilderMode(md.dataset.mode);return;}
  const inc=e.target.closest('[data-inc]'); if(inc){bumpBuilder(+inc.dataset.inc,1);return;}
  const dec=e.target.closest('[data-dec]'); if(dec){bumpBuilder(+dec.dataset.dec,-1);return;}
  const pr=e.target.closest('[data-preset]'); if(pr){applyPreset(pr.dataset.preset);return;}
  const bd=e.target.closest('[data-build]'); if(bd){buildVariant();return;}
  const nb=e.target.closest('[data-newbuild]'); if(nb){variant=null;renderVariant();return;}
  // --- тренировка: отметка статуса, проверка ответа, показать ответ ---
  const tm=e.target.closest('[data-tmark]');
  if(tm){const i=+tm.dataset.ti,it=variant.items[i],cur=(state[it.n]||{})[it.id],m=tm.dataset.tmark;
    recordStatus(it.n,it.id,cur===m?null:m);save();refreshTrainCard(i);return;}
  const tch=e.target.closest('[data-tcheck]');
  if(tch){const i=+tch.dataset.tcheck,it=variant.items[i];
    const wrap=tch.closest('.answer-check'),input=wrap.querySelector('.ans-input'),msg=wrap.querySelector('.ans-msg');
    const raw=input.value.trim();if(!raw)return;
    const correct=plainAnswer(((window.TASKDATA[it.n]||[])[it.id-1]||{}).a),cur=(state[it.n]||{})[it.id];
    if(answersEqual(raw,correct)){
      input.classList.remove('wrong');input.classList.add('correct');reanim(input,'pop');
      if(cur==='b'||cur==='o'){msg.textContent='Правильно! Отметь «умею», когда закрепишь';recordStatus(it.n,it.id,'o');}
      else{msg.textContent='Правильно';recordStatus(it.n,it.id,'g');}
      msg.className='ans-msg ok';reanim(msg,'flash');
    }else{
      input.classList.remove('correct');input.classList.add('wrong');
      msg.textContent='Неправильно';msg.className='ans-msg no';
      reanim(input,'shake');reanim(msg,'flash');recordStatus(it.n,it.id,'b');
    }
    save();refreshTrainCard(i);return;}
  const tsol=e.target.closest('[data-tsol]');
  if(tsol){const i=+tsol.dataset.tsol,box=document.getElementById('tsol-'+i);if(!box)return;
    box.classList.toggle('open');
    if(!box.dataset.filled){const d=(window.TASKDATA[variant.items[i].n]||[])[variant.items[i].id-1]||{};
      box.innerHTML=(d.a?`<span class="answer">Ответ: ${d.a}</span>`:'')+`<div class="sol-body"><div class="tex">${d.s||''}</div></div>`;
      box.dataset.filled='1';typeset(box);}
    return;}
  const vf=e.target.closest('[data-vfinish]'); if(vf){if(confirm('Завершить вариант? Ответы повлияют на прогресс.'))finishVariant();return;}
  const hm=e.target.closest('[data-home]'); if(hm){go('#/');return;}
  const ch=e.target.closest('[data-filter]'); if(ch){viewFilter=ch.dataset.filter;applyFilter();return;}
  const rnd=e.target.closest('[data-random]');
  if(rnd){const r=parseRoute();if(r.view!=='task')return;const pl=protoList(r.n);
    const id=pl?pl[Math.floor(Math.random()*pl.length)].ids[0]:1+Math.floor(Math.random()*taskCfg(r.n).count);
    viewFilter='all';applyFilter();
    const card=document.getElementById('task-'+id);
    if(card){card.scrollIntoView({behavior:'smooth',block:'center'});
      reanim(card,'flash-card');const inp=card.querySelector('.ans-input');if(inp)setTimeout(()=>inp.focus(),320);}
    return;}
  const vhc=e.target.closest('[data-vhclear]');
  if(vhc){if(confirm('Очистить историю пробников?')){saveHistory([]);renderVariant();}return;}
  const t=e.target.closest('[data-go]'); if(t){go('#/t/'+t.dataset.go);return;}
  const mk=e.target.closest('[data-mark]');
  if(mk){const r=parseRoute();if(r.view!=='task')return;const ts=taskState(r.n),id=+mk.dataset.id,m=mk.dataset.mark;
    setStatus(r.n,id, ts[id]===m?null:m);return;}
  const chk=e.target.closest('[data-check]');
  if(chk){const r=parseRoute();if(r.view!=='task')return;const id=+chk.dataset.check,n=r.n;
    const noStatus=chk.dataset.nostatus==='1';
    const wrap=chk.closest('.answer-check'),input=wrap.querySelector('.ans-input'),msg=wrap.querySelector('.ans-msg');
    const rawGiven=input.value.trim();if(!rawGiven)return;
    const correctRaw=plainAnswer(((window.TASKDATA[n]||[])[id-1]||{}).a);
    if(answersEqual(rawGiven,correctRaw)){
      input.classList.remove('wrong');input.classList.add('correct');
      reanim(input,'pop');
      const cur=(state[n]||{})[id];
      if(!noStatus&&(cur==='b'||cur==='o')){
        msg.textContent='Правильно! Отметь «умею решать», когда закрепишь';msg.className='ans-msg ok';
        setStatus(n,id,'o');
      }else{
        msg.textContent='Правильно';msg.className='ans-msg ok';
        if(!noStatus)setStatus(n,id,'g');
      }
      reanim(msg,'flash');
    }else{
      input.classList.remove('correct');input.classList.add('wrong');
      msg.textContent='Неправильно';msg.className='ans-msg no';
      reanim(input,'shake');reanim(msg,'flash');
      if(!noStatus)setStatus(n,id,'b');
    }
    return;}
  const sm=e.target.closest('[data-similar]');
  if(sm){const rep=+sm.dataset.similar,box=document.getElementById('sim-'+rep);if(!box)return;
    if(!box.dataset.filled){const n=parseRoute().n,ids=sm.dataset.simIds.split(',').map(Number);
      box.innerHTML=ids.map(id=>simCardHTML(n,id)).join('');box.dataset.filled='1';typeset(box);}
    const open=box.classList.toggle('open');
    sm.textContent=open?'Скрыть похожие':('Похожие задачи ('+sm.dataset.simN+')');return;}
  const sol=e.target.closest('[data-sol]');
  if(sol){const id=+sol.dataset.sol,box=document.getElementById('sol-'+id);box.classList.toggle('open');
    if(box.dataset.html==='1'){
      if(!box.dataset.filled){const n=parseRoute().n,d=(window.TASKDATA[n]||[])[id-1]||{};
        box.innerHTML=(d.a?`<span class="answer">Ответ: ${d.a}</span>`:'')+`<div class="sol-body"><div class="tex">${d.s||''}</div></div>`;
        box.dataset.filled='1';typeset(box);}
    } else {const img=box.querySelector('img');if(img&&!img.src&&img.dataset.src)img.src=img.dataset.src;}
    return;}
  const cell=e.target.closest('[data-cell]');
  if(cell){viewFilter='all';applyFilter();const tc=document.getElementById('task-'+cell.dataset.cell);
    if(tc)tc.scrollIntoView({behavior:'smooth',block:'start'});return;}
});
appEl.addEventListener('input',e=>{const el=e.target;
  if(el.classList.contains('ans-input')||el.classList.contains('v-input')){
    const cleaned=el.value.replace(/\./g,',').replace(/[^0-9,\-]/g,'');
    if(cleaned!==el.value){const p=el.selectionStart-(el.value.length-cleaned.length);el.value=cleaned;try{el.setSelectionRange(p,p);}catch(_){}}}
});
document.getElementById('theme').addEventListener('click',()=>{
  const dark=document.documentElement.getAttribute('data-theme')==='dark';
  if(dark)document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme','dark');
  const m=document.querySelector('meta[name="theme-color"]');if(m)m.setAttribute('content',dark?'#f4f1ea':'#181a17');
  try{localStorage.setItem('ege_theme',dark?'light':'dark');}catch(e){}
});
document.getElementById('install').addEventListener('click',()=>doInstall());
const hintOv=document.getElementById('hint-overlay');
hintOv.addEventListener('click',e=>{if(e.target===hintOv||e.target.classList.contains('ios-hint-close'))hintOv.classList.remove('open');});
document.getElementById('guide').addEventListener('click',()=>go('#/help'));
document.getElementById('home').addEventListener('click',e=>{if(e.target.closest('a'))return;go('#/');});
appEl.addEventListener('keydown',e=>{if(e.key!=='Enter')return;const inp=e.target.closest('.ans-input');
  if(inp){e.preventDefault();const b=appEl.querySelector('[data-check="'+inp.dataset.id+'"]');if(b)b.click();}});
backEl.addEventListener('click',()=>go('#/'));
document.getElementById('share').addEventListener('click',shareLink);
document.getElementById('reset').addEventListener('click',()=>{const r=parseRoute();
  if(r.view==='variant'||r.view==='help'){return;}
  if(r.view==='task'){if(confirm('Сбросить прогресс по заданию '+r.n+'?')){state[r.n]={};save();renderTask(r.n);}}
  else{if(confirm('Сбросить ВЕСЬ прогресс?')){state={};save();renderHub();}}});
const burgerEl=document.getElementById('burger'),navMenuEl=document.getElementById('nav-menu');
burgerEl.addEventListener('click',e=>{e.stopPropagation();navMenuEl.classList.toggle('open');});
navMenuEl.addEventListener('click',()=>navMenuEl.classList.remove('open'));
document.addEventListener('click',()=>navMenuEl.classList.remove('open'));
window.addEventListener('hashchange',render);
// PWA
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;
  const r=parseRoute();if(r.view==='hub'||r.view==='help')render();});
window.addEventListener('appinstalled',()=>{deferredPrompt=null;render();});
if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{});});}
window.addEventListener('DOMContentLoaded',()=>{
  const params=new URLSearchParams(location.search);
  const sp=params.get('p'),hp=params.get('h');
  if(sp||hp){
    const inc=sp?decodeState(sp):null, incH=hp?histDecode(hp):null;
    if(sp&&!inc) alert('Не удалось прочитать прогресс из ссылки — возможно, она создана в другой версии тренажёра. Прогресс не загружен.');
    const hasProgress=Object.values(state).some(o=>Object.keys(o||{}).length>0);
    let proceed=true;
    if(inc&&hasProgress) proceed=confirm('Загрузить данные из ссылки? Прогресс на этом устройстве будет заменён, история пробников — объединена.');
    if(proceed){
      if(inc){state=inc;save();}
      if(incH){mergeHistory(incH);}
    }
    history.replaceState(null,'',location.pathname);
  }
  render();
});
</script>
</body>
</html>
