function plainAnswer(html){if(!html)return'';const t=document.createElement('div');t.innerHTML=html;return(t.textContent||'').trim();}
function normAns(s){return(s||'').toLowerCase().replace(/\u2212/g,'-').replace(/\s+/g,'').replace(/,/g,'.');}
function parseNum(s){let t=(s||'').toString().replace(/\u2212/g,'-').replace(/\s+/g,'').replace(/,/g,'.').replace(/\.$/,'');
  if(t===''||!/^-?\d*\.?\d+$/.test(t))return null;const n=parseFloat(t);return isFinite(n)?n:null;}
function answersEqual(given,correct){const a=parseNum(given),b=parseNum(correct);
  if(a!==null&&b!==null)return Math.abs(a-b)<1e-9;
  return normAns(given)===normAns(correct);}
function reanim(el,cls){el.classList.remove(cls);void el.offsetWidth;el.classList.add(cls);}
/* Раскрывающая строка. Подпись — существительное, состояние несёт шеврон:
   «Показать решение» рядом с шевроном говорило бы одно и то же дважды, и
   вдвоём с «Похожими задачами» такие подписи не влезали в строку телефона —
   строка переносилась, и карточка отыгрывала назад сэкономленное. */
const CHEV='<svg class="chev" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9.5 6 6 6-6"/></svg>';
const revealLnk=(attr,val,label,extra)=>
  `<button class="lnk" data-${attr}="${val}" aria-expanded="false"${extra||''}>${label}${CHEV}</button>`;
function setReveal(btn,open){btn.classList.toggle('open',open);
  btn.setAttribute('aria-expanded',open);}

/* ---- проявление рисунков ----
   Класс вешаем только на те, что реально ещё не пришли: у загруженного
   рисунка перехода быть не должно. Дефолт в CSS — видимый, так что
   пропущенный вызов не спрячет рисунок, а лишь отменит проявление. */
function armImages(root){
  (root||document).querySelectorAll('img.fig').forEach(img=>{
    if(img.complete && img.naturalWidth) return;
    img.classList.add('pending');
    const show=()=>img.classList.remove('pending');
    img.addEventListener('load',show,{once:true});
    img.addEventListener('error',show,{once:true});
  });
}
/* Ждём декодирования, но не дольше срока: у решений все картинки —
   data:-URI, это миллисекунды; у «похожих» рисунки идут по сети, и там
   важнее открыть вовремя — место под них уже зарезервировано. */
function imagesSettled(root,ms){
  const imgs=[...root.querySelectorAll('img')];
  /* Срок по числу картинок: в лёгком решении их пять, в самом тяжёлом — 43.
     Если открыть, пока они ещё декодируются, декодирование конкурирует за
     процессор с первыми кадрами анимации — отсюда и подтормаживание.
     Тап при этом не остаётся без ответа: шеврон поворачивается сразу. */
  const cap=ms||Math.min(520,260+imgs.length*7);
  const all=Promise.all(imgs.map(i=>(i.decode?i.decode():Promise.resolve()).catch(()=>{})));
  return Promise.race([all,new Promise(r=>setTimeout(r,cap))]);
}
/* Высота меняется только переходом — 0 -> контент, скелетон -> контент,
   контент -> 0. Поэтому «дёрнуться» здесь нечему в принципе. */
function setBoxOpen(box,open){
  const from=box.getBoundingClientRect().height;
  box.style.overflow='hidden';
  let to=0;
  if(open){
    box.style.height='auto';
    to=box.getBoundingClientRect().height;
    box.style.height=from+'px';
  }
  /* Время по расстоянию: короткий блок разворачивается быстро, длинное
     решение — заметно медленнее. Потолок, чтобы не превращалось в ожидание. */
  const dur=Math.round(Math.min(600,Math.max(230,230+Math.abs(to-from)*0.4)));
  box.style.transitionDuration=dur+'ms';
  /* Проявление держим пропорциональным раскрытию. Если содержимое станет
     полностью видимым сильно раньше, чем коробка дорастёт, хвост движения
     снова читается как растягивание жёсткого блока. */
  const inner=box.firstElementChild;
  if(inner)inner.style.transitionDuration=Math.round(dur*0.7)+'ms';
  void box.offsetWidth;
  if(open){
    box.classList.add('open');
    box.style.height=to+'px';
    onceHeightDone(box,()=>{
      if(box.dataset.want==='1'){box.style.height='auto';box.style.overflow='visible';}},dur);
  }else{
    box.classList.remove('open');
    box.style.height='0px';
    onceHeightDone(box,()=>{},dur);
  }
}
/* transitionend может не прийти (нулевая длительность при reduced-motion,
   совпавшие значения) — поэтому всегда есть запасной таймер. */
function onceHeightDone(box,fn,dur){
  let done=false;
  const fire=()=>{if(done)return;done=true;box.removeEventListener('transitionend',h);fn();};
  const h=e=>{if(e.target===box&&e.propertyName==='height')fire();};
  box.addEventListener('transitionend',h);
  setTimeout(fire,(dur||260)+120);
}
/* Единый путь для всех раскрывающих строк: «Решение», «Похожие задачи»
   и «Ответ» в тренировке. Раньше это были три независимые копии логики,
   и вели они себя по-разному. */
function revealToggle(btn,box,build,ensureFn){
  const want=box.dataset.want!=='1';
  box.dataset.want=want?'1':'0';
  setReveal(btn,want);
  if(!want){setBoxOpen(box,false);return;}
  if(box.dataset.filled){setBoxOpen(box,true);return;}
  const paint=()=>{
    if(box.dataset.want!=='1')return;
    box.style.height=box.getBoundingClientRect().height+'px'; // заморозить старт
    box.innerHTML=build();
    box.dataset.filled='1';
    typeset(box);
    armImages(box);
    imagesSettled(box).then(()=>{if(box.dataset.want==='1')setBoxOpen(box,true);});
  };
  if(!ensureFn){paint();return;}
  /* Если файл решений не успел приехать — открываем скелетон, чтобы тап
     не остался без ответа. Переход скелетон -> решение такой же плавный. */
  const slow=setTimeout(()=>{
    if(box.dataset.want==='1'&&!box.dataset.filled){
      box.innerHTML='<div class="sk-sol"><div class="sk-line" style="height:12px;width:34%"></div>'+
        '<div class="sk-line" style="height:12px;width:92%"></div>'+
        '<div class="sk-line" style="height:12px;width:78%"></div></div>';
      setBoxOpen(box,true);}
  },260);
  ensureFn(()=>{clearTimeout(slow);paint();});
}
const solInner=(ans,html)=>`<div class="sol-inner">`+
  (ans?`<span class="answer">Ответ: ${ans}</span>`:'')+
  `<div class="sol-body"><div class="tex">${html||''}</div></div></div>`;
/* Та же полоска, что на карточках хаба: на телефоне она заменяет собой
   карту из 27 клеток, а карта уезжает под раскрытие. */
function barHTML(c,tot){const p=x=>tot?(x/tot*100).toFixed(1):0;
  return `<span class="bar"><span class="bg" style="width:${p(c.g)}%"></span>`+
    `<span class="bo" style="width:${p(c.o)}%"></span>`+
    `<span class="bb" style="width:${p(c.b)}%"></span></span>`;}
function refreshPanelBar(n){const bar=document.querySelector('.panel-toggle .bar');
  if(!bar)return;const c=countTask(n),t=displayCount(n),p=x=>t?(x/t*100).toFixed(1):0;
  const w=[p(c.g),p(c.o),p(c.b)];
  [...bar.children].forEach((el,i)=>{el.style.width=w[i]+'%';});}
function refreshCell(n,id){const st=(state[n]||{})[id]||'';const grid=document.querySelector('.grid');
  const c=grid&&grid.querySelector('[data-cell="'+id+'"]');
  if(c)c.className='cell'+(st?' '+st:'');
  refreshPanelBar(n);
  /* сетка озвучивается одной сводкой, поэтому её надо пересчитывать после отметки */
  if(grid&&grid.getAttribute('role')==='img'){const q=countTask(n),t=displayCount(n);
    grid.setAttribute('aria-label',`Карта прогресса: умею ${q.g}, надо повторить ${q.o}, надо разобраться ${q.b}, не решал ${t-q.g-q.o-q.b} из ${t}`);}}
function refreshCard(n,id){const st=(state[n]||{})[id]||'';const card=document.getElementById('task-'+id);
  if(!card)return;card.className='card'+(st?' is-'+st:'');
  card.querySelectorAll('[data-mark]').forEach(b=>{const on=b.dataset.mark===st;
    b.classList.toggle('on',on);b.setAttribute('aria-pressed',on);});}
function recordStatus(n,id,status){const ts=taskState(n);if(status)ts[id]=status;else delete ts[id];}
function setStatus(n,id,status){
  /* Карточка, которую только что отметили, остаётся на месте до следующего
     переключения фильтра. Раньше applyFilter прятал её сразу: при фильтре
     «Не решал» нажатие «Умею» убирало карточку из-под пальца, а всё, что
     ниже, прыгало вверх на пол-экрана. При проверке ответа было хуже —
     карточка исчезала раньше, чем ученик успевал прочитать «Правильно».
     Отметка и так видна: сегмент подсвечен, левый кант карточки сменил цвет. */
  filterKeep.add(id);
  recordStatus(n,id,status);save();refreshCard(n,id);refreshCell(n,id);applyFilter();}

// --- фильтр по статусу внутри задания ---
let viewFilter='all';
/* id карточек, отмеченных при активном фильтре: они не подпадают под
   скрытие, пока ученик сам не переключит фильтр. */
let filterKeep=new Set();
function applyFilter(){
  if(parseRoute().view!=='task')return;
  const ts=state[parseRoute().n]||{};
  let shown=0;
  document.querySelectorAll('.list .card').forEach(card=>{
    const id=+card.id.replace('task-','');const st=ts[id]||'';
    let ok=true;
    if(viewFilter==='o')ok=st==='o';
    else if(viewFilter==='b')ok=st==='b';
    else if(viewFilter==='none')ok=!st;
    if(!ok&&filterKeep.has(id))ok=true;
    card.style.display=ok?'':'none';if(ok)shown++;
  });
  const empty=document.getElementById('filter-empty');
  if(empty)empty.style.display=shown?'none':'block';
  document.querySelectorAll('.list .block').forEach(b=>{
    const any=[...b.querySelectorAll('.card')].some(c=>c.style.display!=='none');
    b.style.display=any?'':'none';
  });
  document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c.dataset.filter===viewFilter));
}

/* Смена фильтра пересобирает список целиком. Мгновенная подмена читается
   как сбой отрисовки, поэтому список гаснет, меняется и проявляется.
   Переход короткий: это не эффект, а способ показать, что список тот же,
   просто в нём стало другое содержимое. */
function switchFilter(){
  const list=document.querySelector('.list');
  if(!list||!matchMedia('(prefers-reduced-motion: no-preference)').matches){applyFilter();return;}
  list.classList.add('swapping');
  setTimeout(()=>{applyFilter();list.classList.remove('swapping');},130);
}

// --- перевод первичного балла в тестовый (профиль; 0..12 задач = 0..12 баллов) ---
const SEC_SCORE=[0,6,11,17,22,27,34,40,46,52,58,64,70];
function secondaryScore(primary){return SEC_SCORE[Math.min(primary,SEC_SCORE.length-1)];}
function fmtTime(ms){const s=Math.floor(ms/1000),m=Math.floor(s/60);return String(m).padStart(2,'0')+':'+String(s%60).padStart(2,'0');}
function ensureAll(ns,cb){let left=ns.length;if(!left){cb();return;}ns.forEach(n=>ensureData(n,()=>{if(--left===0)cb();}));}

// --- история пробников (отдельный ключ, в ссылку прогресса не входит) ---
const HIST_KEY='ege_variants_v1';
function loadHistory(){try{return JSON.parse(localStorage.getItem(HIST_KEY))||[];}catch(e){return[];}}
function saveHistory(a){try{localStorage.setItem(HIST_KEY,JSON.stringify(a));}catch(e){}}
function pushHistory(rec){const a=loadHistory();a.push(rec);if(a.length>50)a.splice(0,a.length-50);saveHistory(a);}

// компактная упаковка истории в ссылку (отдельный параметр &h=)
function packBits(list){const by=[];let cur=0,fill=0;
  for(const[v,n]of list){for(let i=n-1;i>=0;i--){cur=(cur<<1)|((v>>i)&1);if(++fill===8){by.push(cur);cur=0;fill=0;}}}
  if(fill>0)by.push(cur<<(8-fill));return by;}
function bytesToB64(by){return btoa(String.fromCharCode(...by)).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');}
function b64ToBytes(str){let b=str.replace(/-/g,'+').replace(/_/g,'/');while(b.length%4)b+='=';return Array.from(atob(b),c=>c.charCodeAt(0));}
function histEncode(){
  const h=loadHistory();if(!h.length)return'';
  const s=h.slice().sort((a,b)=>a.t-b.t),base=Math.floor(s[0].t/60000),L=[];
  L.push([1,8]);L.push([Math.min(s.length,255),8]);L.push([base,32]);
  s.slice(0,255).forEach(r=>{
    const dm=Math.min(Math.max(Math.floor(r.t/60000)-base,0),1048575);
    L.push([dm,20]);L.push([Math.min(r.p|0,15),4]);L.push([Math.min(r.total|0,31),5]);
    L.push([Math.min(Math.round(r.ms/1000),16383),14]);
  });
  return bytesToB64(packBits(L));
}
function histDecode(str){
  try{const by=b64ToBytes(str);let idx=0,bit=0;
    const read=n=>{let v=0;for(let k=0;k<n;k++){v=(v<<1)|((by[idx]>>(7-bit))&1);if(++bit===8){bit=0;idx++;}}return v;};
    if(read(8)!==1)return null;const count=read(8),base=read(32),out=[];
    for(let i=0;i<count;i++){const dm=read(20),p=read(4),tot=read(5),sec=read(14);
      out.push({t:(base+dm)*60000,p,total:tot,s:secondaryScore(p),ms:sec*1000});}
    return out;}catch(e){return null;}
}
function mergeHistory(incoming){
  const key=r=>Math.floor(r.t/60000)+':'+r.p+':'+r.total,map={};
  loadHistory().concat(incoming).forEach(r=>{map[key(r)]=r;});
  let arr=Object.values(map).sort((a,b)=>a.t-b.t);
  if(arr.length>50)arr=arr.slice(arr.length-50);
  saveHistory(arr);
}
function fmtDate(ts){try{return new Date(ts).toLocaleString('ru-RU',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});}catch(e){return'';}}
function sparkline(hist){
  const vals=hist.map(h=>h.s);if(vals.length<2)return'';
  const w=320,h=48,max=Math.max(...vals),min=Math.min(...vals),span=Math.max(max-min,1);
  const xy=vals.map((v,i)=>{const x=6+i*(w-12)/(vals.length-1);const y=h-6-((v-min)/span)*(h-16);return[x,y];});
  const line=xy.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
  const dots=xy.map(p=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="2.4" fill="var(--accent)"/>`).join('');
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
    <polyline points="${line}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>${dots}</svg>`;
}
function histPanel(){
  const hist=loadHistory();if(!hist.length)return'';
  const rows=hist.slice().reverse().slice(0,12).map(h=>`<div class="vhist-row">
      <span class="vh-date">${fmtDate(h.t)}</span>
      <span class="vh-score">${h.p}/${h.total} верно</span>
      <span class="vh-sec">тест. ${h.s}</span>
      <span class="vh-time">${fmtTime(h.ms)}</span>
    </div>`).join('');
  return `<div class="vhist">
    <div class="vhist-head"><span>Мои пробники</span><button class="vhist-clear" data-vhclear>очистить</button></div>
    ${sparkline(hist)}
    <div class="vhist-list">${rows}</div>
  </div>`;
}

const STATE_VER=2;
// Самоописываемый формат: версия + для каждого задания с отметками его номер,
// максимальный отмеченный id и статусы 1..maxId. Не зависит от текущего TASKS,
// поэтому смена count / порядка / добавление заданий не ломает старые ссылки.
function encodeState(){
  const L=[],blocks=[];
  Object.keys(state).forEach(k=>{const n=+k,ts=state[k]||{};
    const ids=Object.keys(ts).map(Number).filter(id=>ts[id]);
    if(ids.length)blocks.push({n,maxId:Math.max(...ids),ts});});
  L.push([STATE_VER,8]);L.push([blocks.length,8]);
  blocks.forEach(b=>{L.push([b.n,8]);L.push([b.maxId,16]);
    for(let id=1;id<=b.maxId;id++){const s=b.ts[id];L.push([s==='g'?1:s==='b'?2:s==='o'?3:0,2]);}});
  return bytesToB64(packBits(L));
}
function decodeState(str){
  try{const by=b64ToBytes(str);let idx=0,bit=0;
    const read=n=>{let v=0;for(let k=0;k<n;k++){v=(v<<1)|((by[idx]>>(7-bit))&1);if(++bit===8){bit=0;idx++;}}return v;};
    if(read(8)!==STATE_VER)return null;          // другая версия формата — отвергаем явно
    const tc=read(8);if(tc>40)return null;
    const res={};
    for(let i=0;i<tc;i++){const n=read(8),maxId=read(16);
      if(n<1||n>40||maxId<1||maxId>2000)return null;
      res[n]=res[n]||{};
      for(let id=1;id<=maxId;id++){const v=read(2);
        if(v===1)res[n][id]='g';else if(v===2)res[n][id]='b';else if(v===3)res[n][id]='o';}}
    if(idx>by.length)return null;                // строка обрезана — не доверяем
    return res;
  }catch(e){return null;}
}
function shareLink(){
  let q='?p='+encodeState();const h=histEncode();if(h)q+='&h='+h;
  const url=location.origin+location.pathname+q;
  navigator.clipboard.writeText(url).then(()=>{const b=document.getElementById('share'),o=b.textContent;
    b.textContent='✓ Скопировано';setTimeout(()=>b.textContent=o,1800);},()=>prompt('Ссылка с прогрессом:',url));
}

/* Лист возвращает обещание: вызывающий код читается так же, как раньше
   с confirm(), только не блокирует поток и не выпадает из интерфейса. */
let sheetResolve=null;
function showSheet(html){

}
function closeSheet(v){

function ask(o){
  return new Promise(res=>{sheetResolve=res;
    showSheet(`<h3>${o.title}</h3>`+(o.text?`<p class="ih-sub">${o.text}</p>`:'')+

const MARKS=[

/* ---- единый шлюз отрисовки ----
   Экран собирается за пределами вида, KaTeX отрабатывает там же, и в
   документ переезжает уже готовый результат. Поэтому состояния «текст
   задачи стоит, а формулы ещё догружаются» не бывает в принципе.
   Раньше так делал только экран задания; вариант и тренировка ставили
   innerHTML и звали typeset после — и там формулы схлопывались на место
   поверх уже показанного текста.
   Ждём шрифты и рисунки первых двух карточек — то, что попадёт в первый
   экран. Остальные рисунки приезжают в уже размеченные места (width/height
   проставлены у всех) и проявляются, а не возникают.
   Потолок ожидания обязателен: ни один сетевой сбой не должен оставить
   ученика со скелетоном навсегда. */
function stageAndMount(html,guard,after){
  const tmp=document.createElement('div');
  tmp.style.cssText='position:fixed;top:-9999px;left:0;visibility:hidden;pointer-events:none;width:'
    +(appEl.clientWidth||375)+'px';
  tmp.innerHTML=html;
  document.body.appendChild(tmp);
  typeset(tmp);                                   // запускает и загрузку шрифтов KaTeX
  const first=[...tmp.querySelectorAll('.card,.vcard')].slice(0,2);
  const imgs=first.flatMap(c=>[...c.querySelectorAll('img')]).filter(i=>!i.complete);
  const waits=imgs.map(i=>new Promise(r=>{
    i.addEventListener('load',r,{once:true});i.addEventListener('error',r,{once:true});}));
  Promise.race([Promise.all([...waits,document.fonts.ready]),
                new Promise(r=>setTimeout(r,2500))]).then(()=>{
    if(guard&&!guard()){tmp.remove();return;}
    /* Переносим собранные узлы, а не пересобираем разметку заново: второй
       прогон KaTeX по 27 карточкам стоил столько же, сколько первый. */
    appEl.replaceChildren(...tmp.childNodes);
    tmp.remove();
    armImages(appEl);
    syncHeaderH();
    if(after)after();
  });
}
function renderTask(n){

    setBack(true); statsEl.innerHTML='';
    appEl.innerHTML=skHTML;
    ensureData(n,()=>{ if(parseRoute().n===n) renderTask(n); });
    return;
  }
  if(task.mode==='html' && window.TASKDATA[n]==='error'){
    setBack(true); statsEl.innerHTML='';

            никто не должен отбирать у них канал;
     2-7  — обычный приоритет, но грузятся сразу: это ближайшая прокрутка;
     8+   — lazy. Браузер начинает тянуть их за один-два экрана до появления,

      return `<div class="cond"><img loading="lazy" src="${COND(n,id)}" alt="Задача ${id}"></div>`;
    let c=(data[id-1]||{}).c||'';
    if(ord<WAIT_CARDS)      c=c.replace(/ loading="lazy"/g,' fetchpriority="high"');
    else if(ord<EAGER_CARDS)c=c.replace(/ loading="lazy"/g,'');
    return `<div class="cond"><div class="tex">${c}</div></div>`;
  };
  const solBox=id=>task.mode==='html'
      ?`<div class="solution" id="sol-${id}" data-html="1"></div>`
      :`<div class="solution" id="sol-${id}"><div class="sol-body"><img loading="lazy" data-src="${SOL(n,id)}" alt="Решение ${id}"></div></div>`;
  const pl=protoList(n);
  const acHTML=id=>{const ansTxt=task.mode==='html'?plainAnswer((data[id-1]||{}).a):'';
    return ansTxt?`<div class="answer-check">
          <input class="ans-input" type="text" inputmode="decimal" placeholder="Ваш ответ" aria-label="Ваш ответ" data-id="${id}" autocomplete="off">

    return m?+m[1]:0;};

        <button class="ghost task-theme" data-task-theme title="Сменить тему" aria-label="Сменить тему"><svg class="ic-moon" width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg><svg class="ic-sun" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/></svg></button>
      </div>
      <div class="panel-body" id="panel-body">

        <div class="grid" role="img" aria-label="${gridSummary}">${gridCells}</div>${videoBtn}

    <main class="list">
      <div class="filters">
        <button class="chip on" data-filter="all">Все</button>
        <button class="chip" data-filter="o">Надо повторить</button>

        <button class="chip" data-filter="none">Не решал</button>
      </div>
      <div class="filters-empty" id="filter-empty" style="display:none">В этой категории пока пусто.</div>
      ${listBody}</main></div>`;
  appEl.innerHTML=skHTML;
  /* Сводку в шапку тут не пишем: на экране задания шапка скрыта, и эти
     цифры уходили в никуда. Состояние показывает карта прогресса слева,
     её aria-label несёт те же числа для голосового доступа. */
  stageAndMount(fullHTML,()=>parseRoute().n===n,()=>prefetchSol([n]));
}

function buildVariant(){
  if(!builder)builder=loadBuilder();
  const sel=activeTasks().filter(t=>(builder.counts[t.n]||0)>0).map(t=>t.n);
  if(!sel.length)return;
  const mode=builder.mode;
  appEl.innerHTML='<div class="vbox"><p style="color:var(--muted)">Собираю вариант…</p></div>';
  ensureAll(sel,()=>{
    const items=[];
    sel.forEach(n=>{if(!Array.isArray(window.TASKDATA[n]))return;
      const want=builder.counts[n],pl=protoList(n);
      let ids;
      if(pl&&pl.length){                                              // выбираем разные прототипы, по случайному экземпляру каждого
        ids=shuffle(pl.slice()).slice(0,Math.min(want,pl.length))
          .map(grp=>grp.ids[Math.floor(Math.random()*grp.ids.length)]);
      }else{                                                          // нет прототипов — разные задачи подряд
        ids=shuffle(Array.from({length:taskCfg(n).count},(_,i)=>i+1)).slice(0,Math.min(want,taskCfg(n).count));
      }
      ids.forEach(id=>items.push({n,id}));});

    variant={items,mode,started:true,finished:false,startAt:Date.now(),elapsed:0};

    setStatus(r.n,id, ts[id]===m?null:m);return;}
  const chk=e.target.closest('[data-check]');
  if(chk){const r=parseRoute();if(r.view!=='task')return;const id=+chk.dataset.check,n=r.n;
    const noStatus=chk.dataset.nostatus==='1';
    const wrap=chk.closest('.answer-check'),input=wrap.querySelector('.ans-input'),msg=wrap.querySelector('.ans-msg');
    const rawGiven=input.value.trim();if(!rawGiven)return;
    const correctRaw=plainAnswer(((window.TASKDATA[n]||[])[id-1]||{}).a);
    if(answersEqual(rawGiven,correctRaw)){
      input.classList.remove('wrong');input.classList.add('correct');
      reanim(input,'pop');
      const cur=(state[n]||{})[id];
      if(!noStatus&&(cur==='b'||cur==='o')){
        msg.textContent='Правильно! Отметь «умею решать», когда закрепишь';msg.className='ans-msg ok';
        setStatus(n,id,'o');
      }else{
        msg.textContent='Правильно';msg.className='ans-msg ok';
        if(!noStatus)setStatus(n,id,'g');
      }
      reanim(msg,'flash');
    }else{
      input.classList.remove('correct');input.classList.add('wrong');
      msg.textContent='Неправильно';msg.className='ans-msg no';
      reanim(input,'shake');reanim(msg,'flash');
      if(!noStatus)setStatus(n,id,'b');
    }
    return;}
  const sm=e.target.closest('[data-similar]');
  if(sm){const r0=+sm.dataset.similar,box=document.getElementById('sim-'+r0);if(!box)return;
    const n=parseRoute().n,ids=sm.dataset.simIds.split(',').map(Number);
    revealToggle(sm,box,()=>`<div class="sim-inner">${ids.map(id=>simCardHTML(n,id)).join('')}</div>`);
    return;}
  const sol=e.target.closest('[data-sol]');
  if(sol){const id=+sol.dataset.sol,box=document.getElementById('sol-'+id),n=parseRoute().n;
    const d=(window.TASKDATA[n]||[])[id-1]||{};
    revealToggle(sol,box,()=>solInner(d.a,solOf(n,id)),cb=>ensureSol(n,cb));
    return;}
});
appEl.addEventListener('input',e=>{const el=e.target;
  if(el.classList.contains('ans-input')||el.classList.contains('v-input')){
    const cleaned=el.value.replace(/\./g,',').replace(/[^0-9,\-]/g,'');
    if(cleaned!==el.value){const p=el.selectionStart-(el.value.length-cleaned.length);el.value=cleaned;try{el.setSelectionRange(p,p);}catch(_){}}}
});
/* Один переключатель на обе кнопки — в шапке и в панели задания.
   Были две копии, и они успели разойтись: писали разные theme-color. */
function toggleTheme(){
  const dark=document.documentElement.getAttribute('data-theme')==='dark';
  if(dark)document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme','dark');
  const m=document.querySelector('meta[name="theme-color"]');
  if(m)m.setAttribute('content',dark?THEME_COLOR.light:THEME_COLOR.dark);
  try{localStorage.setItem('ege_theme',dark?'light':'dark');}catch(e){}
}
document.getElementById('theme').addEventListener('click',toggleTheme);
document.getElementById('install').addEventListener('click',()=>doInstall());
const hintOv=document.getElementById('sheet-ov');
hintOv.addEventListener('click',e=>{
  const b=e.target.closest('[data-sheet]');
  if(b){closeSheet(b.dataset.sheet==='1');return;}
  /* клик по затемнению и по «Понятно» у подсказок без data-sheet */
  if(e.target===hintOv||e.target.classList.contains('sheet-go'))closeSheet(false);
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&hintOv.classList.contains('open'))closeSheet(false);});
document.getElementById('guide').addEventListener('click',()=>go('#/help'));
document.getElementById('home').addEventListener('click',e=>{if(e.target.closest('a'))return;go('#/');});
appEl.addEventListener('keydown',e=>{if(e.key!=='Enter')return;const inp=e.target.closest('.ans-input');
  if(inp){e.preventDefault();const b=appEl.querySelector('[data-check="'+inp.dataset.id+'"]');if(b)b.click();}});
backEl.addEventListener('click',()=>go('#/'));
document.getElementById('share').addEventListener('click',shareLink);
document.getElementById('reset').addEventListener('click',()=>{const r=parseRoute();
  if(r.view==='variant'||r.view==='help'){return;}
  if(r.view==='task')
    ask({title:'Сбросить прогресс по заданию '+r.n+'?',
      text:'Отметки по всем прототипам этого задания будут сняты. Остальные задания не тронутся.',
      ok:'Сбросить',danger:true}).then(y=>{if(y){state[r.n]={};save();renderTask(r.n);}});
  else
    ask({title:'Сбросить весь прогресс?',
      text:'Отметки по всем заданиям будут сняты. История пробников останется.',
      ok:'Сбросить всё',danger:true}).then(y=>{if(y){state={};save();renderHub();}});});
const burgerEl=document.getElementById('burger'),navMenuEl=document.getElementById('nav-menu');
burgerEl.addEventListener('click',e=>{e.stopPropagation();navMenuEl.classList.toggle('open');});
navMenuEl.addEventListener('click',()=>navMenuEl.classList.remove('open'));
document.addEventListener('click',()=>navMenuEl.classList.remove('open'));
window.addEventListener('hashchange',render);
// PWA
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;
  const r=parseRoute();if(r.view==='hub'||r.view==='help')render();});
window.addEventListener('appinstalled',()=>{deferredPrompt=null;render();});
if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{});});}
window.addEventListener('DOMContentLoaded',()=>{
  const params=new URLSearchParams(location.search);
  const sp=params.get('p'),hp=params.get('h');
  if(sp||hp){
    const inc=sp?decodeState(sp):null, incH=hp?histDecode(hp):null;
    const hasProgress=Object.values(state).some(o=>Object.keys(o||{}).length>0);
    const apply=proceed=>{
      if(proceed){
        if(inc){state=inc;save();}
        if(incH){mergeHistory(incH);}
      }
      history.replaceState(null,'',location.pathname);
      render();
    };
    if(sp&&!inc)
      note('Не удалось прочитать ссылку',
        'Возможно, она создана в другой версии тренажёра. Прогресс не загружен.').then(()=>apply(true));
    else if(inc&&hasProgress)
      ask({title:'Загрузить прогресс из ссылки?',
        text:'Прогресс на этом устройстве будет заменён, история пробников — объединена.',
        ok:'Загрузить'}).then(apply);
    else apply(true);
    return;
  }
  render();
});
</script>
